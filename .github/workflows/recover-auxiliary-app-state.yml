name: Recover auxiliary app state from inventoried machines

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-auxiliary-app-state.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recover-auxiliary-app-state
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Extract SpaceMountainLive and MikaBot state; inventory other volumes
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_MAIN || secrets.FLY_API_TOKEN }}
        run: |
          set -uo pipefail
          mkdir -p recovered/spacemountain recovered/mika-bot recovered/aetherra recovered/rotator logs
          if [ -z "${FLY_API_TOKEN:-}" ]; then echo "::error::Fly API token secret missing"; exit 1; fi

          # SpaceMountainLive: small app database, not browser/media data.
          APP=spacemountain-live
          MACHINE=8953d6a6dd5058
          echo "Source: $APP / $MACHINE / vol_42kmdp560dmgwl94" > recovered/spacemountain/TARGET.txt
          for remote in /data/database.db; do
            if timeout 180s flyctl ssh sftp get "$remote" "recovered/spacemountain/$(basename "$remote")" --app "$APP" --machine "$MACHINE" --quiet </dev/null > logs/spacemountain-db.out 2> logs/spacemountain-db.err; then
              sha256sum "recovered/spacemountain/$(basename "$remote")" > recovered/spacemountain/SHA256SUMS
            else
              echo "$remote" > recovered/spacemountain/FAILED.txt
              cat logs/spacemountain-db.err || true
            fi
          done

          # MikaBot: compact JSON configuration and stats database only.
          APP=mika-bot
          MACHINE=2871545a942658
          echo "Source: $APP / $MACHINE / vol_4m3k2eqowknmqyzv" > recovered/mika-bot/TARGET.txt
          cat > /tmp/mika-list.sh <<'REMOTE'
          set -u
          find /app/data -maxdepth 2 -type f -size -100M \( -iname "*.json" -o -iname "*.db" -o -iname "*.sqlite" -o -iname "*.sqlite3" \) -print 2>/dev/null | sort > /tmp/mika-files.txt
          REMOTE
          encoded="$(base64 -w0 /tmp/mika-list.sh)"
          if timeout 45s flyctl ssh console --app "$APP" --machine "$MACHINE" --command "sh -c 'echo $encoded | base64 -d > /tmp/mika-list.sh; sh /tmp/mika-list.sh'" --quiet </dev/null > logs/mika-list.out 2> logs/mika-list.err &&
             timeout 90s flyctl ssh sftp get /tmp/mika-files.txt recovered/mika-bot/remote-files.txt --app "$APP" --machine "$MACHINE" --quiet </dev/null > logs/mika-list-download.out 2> logs/mika-list-download.err; then
            count=0
            while IFS= read -r remote; do
              [ -n "$remote" ] || continue
              case "$remote" in /app/data/*) ;; *) continue ;; esac
              dest="recovered/mika-bot/${remote#/app/data/}"
              mkdir -p "$(dirname "$dest")"
              if timeout 90s flyctl ssh sftp get "$remote" "$dest" --app "$APP" --machine "$MACHINE" --quiet </dev/null > "logs/mika-file-$count.out" 2> "logs/mika-file-$count.err"; then
                [ -s "$dest" ] && sha256sum "$dest" >> recovered/mika-bot/SHA256SUMS
              else
                echo "$remote" >> recovered/mika-bot/FAILED.txt
              fi
              count=$((count+1))
            done < recovered/mika-bot/remote-files.txt
            echo "files_attempted=$count" > recovered/mika-bot/RECOVERY-REPORT.txt
          else
            echo "MikaBot file list could not be read." > recovered/mika-bot/RECOVERY-REPORT.txt
            cat logs/mika-list.err logs/mika-list-download.err 2>/dev/null || true
          fi

          # Aetherra and Rotator were preserved as cloned volumes. Inventory using a base64 script
          # to avoid nested-shell quoting errors; do not copy credentials or large databases here.
          cat > /tmp/inventory-data-root.sh <<'REMOTE'
          echo "=== data root ==="
          ls -lah /data 2>&1
          echo "=== structured files under 100 MB ==="
          find /data -maxdepth 3 -type f -size -100M \( -iname "*.json" -o -iname "*.db" -o -iname "*.sqlite" -o -iname "*.sqlite3" -o -iname "*.yaml" -o -iname "*.yml" -o -iname "*.toml" \) -printf "%s %p\\n" 2>/dev/null | head -n 500
          echo "=== large database candidates ==="
          find /data -maxdepth 2 -type f -size +100M -printf "%s %p\\n" 2>/dev/null | head -n 100
          REMOTE
          inventory_encoded="$(base64 -w0 /tmp/inventory-data-root.sh)"
          for spec in "aetherra 080d0d5c556068" "mtman-machine-rotator 2862e02c9263d8"; do
            APP="${spec%% *}"
            MACHINE="${spec##* }"
            dir="recovered/aetherra"
            [ "$APP" = "mtman-machine-rotator" ] && dir="recovered/rotator"
            echo "Source: $APP / $MACHINE (volume clone preserved separately)" > "$dir/TARGET.txt"
            if timeout 60s flyctl ssh console --app "$APP" --machine "$MACHINE" --command "sh -c 'echo $inventory_encoded | base64 -d | sh'" --quiet </dev/null > "$dir/INVENTORY.txt" 2> "$dir/INVENTORY-ERROR.txt"; then
              echo "inventory_read=yes" >> "$dir/TARGET.txt"
              cat "$dir/INVENTORY.txt"
            else
              echo "inventory_read=no; cloned volume remains preserved" >> "$dir/TARGET.txt"
              cat "$dir/INVENTORY-ERROR.txt" || true
            fi
          done

          # Export Aetherra's database/backups from its preserved-volume source; exclude key files.
          APP=aetherra
          MACHINE=080d0d5c556068
          mkdir -p recovered/aetherra/data
          cat > /tmp/aetherra-pack.sh <<'REMOTE'
          set -u
          mkdir -p /tmp/aetherra-recovery
          if command -v sqlite3 >/dev/null 2>&1; then
            sqlite3 /data/aetherra.db ".backup /tmp/aetherra-recovery/aetherra.db" && echo SQLITE_BACKUP_OK
          elif command -v python3 >/dev/null 2>&1; then
            python3 -c "import sqlite3; s=sqlite3.connect('file:/data/aetherra.db?mode=ro',uri=True); d=sqlite3.connect('/tmp/aetherra-recovery/aetherra.db'); s.backup(d); d.close(); s.close(); print('SQLITE_BACKUP_OK')"
          else
            cp /data/aetherra.db /tmp/aetherra-recovery/aetherra.db
            [ ! -f /data/aetherra.db-wal ] || cp /data/aetherra.db-wal /tmp/aetherra-recovery/aetherra.db-wal
            [ ! -f /data/aetherra.db-shm ] || cp /data/aetherra.db-shm /tmp/aetherra-recovery/aetherra.db-shm
            echo DIRECT_DB_AND_WAL_COPY
          fi
          if [ -d /data/backups ]; then
            find /data/backups -maxdepth 2 -type f -size -100M \( -iname "*.db" -o -iname "*.sqlite" -o -iname "*.sqlite3" -o -iname "*.json" \) -exec cp --parents {} /tmp/aetherra-recovery/ \; 2>/dev/null || true
          fi
          tar -czf /tmp/aetherra-recovery.tar.gz -C /tmp/aetherra-recovery .
          tar -tzf /tmp/aetherra-recovery.tar.gz > /tmp/aetherra-recovery-list.txt
          REMOTE
          encoded_aetherra="$(base64 -w0 /tmp/aetherra-pack.sh)"
          if timeout 90s flyctl ssh console --app "$APP" --machine "$MACHINE" --command "sh -c 'echo $encoded_aetherra | base64 -d > /tmp/aetherra-pack.sh; sh /tmp/aetherra-pack.sh'" --quiet </dev/null > logs/aetherra-pack.out 2> logs/aetherra-pack.err; then
            if timeout 300s flyctl ssh sftp get /tmp/aetherra-recovery.tar.gz recovered/aetherra/data/aetherra-state.tar.gz --app "$APP" --machine "$MACHINE" --quiet </dev/null > logs/aetherra-sftp.out 2> logs/aetherra-sftp.err; then
              tar -tzf recovered/aetherra/data/aetherra-state.tar.gz > recovered/aetherra/data/ARCHIVE-CONTENTS.txt
              sha256sum recovered/aetherra/data/aetherra-state.tar.gz > recovered/aetherra/data/SHA256SUMS
              echo "Aetherra state archive downloaded." | tee recovered/aetherra/data/RESULT.txt
            else
              echo "Aetherra archive download failed." > recovered/aetherra/data/RESULT.txt
            fi
          else
            echo "Aetherra archive creation failed." > recovered/aetherra/data/RESULT.txt
            cat logs/aetherra-pack.err || true
          fi

          # Export Rotator structured state and mountainview database, excluding credentials and repo clones.
          APP=mtman-machine-rotator
          MACHINE=2862e02c9263d8
          mkdir -p recovered/rotator/data
          cat > /tmp/rotator-pack.sh <<'REMOTE'
          set -u
          mkdir -p /tmp/rotator-recovery
          if command -v sqlite3 >/dev/null 2>&1; then
            sqlite3 /data/mountainview.db ".backup /tmp/rotator-recovery/mountainview.db" && echo SQLITE_BACKUP_OK
          elif command -v python3 >/dev/null 2>&1; then
            python3 -c "import sqlite3; s=sqlite3.connect('file:/data/mountainview.db?mode=ro',uri=True); d=sqlite3.connect('/tmp/rotator-recovery/mountainview.db'); s.backup(d); d.close(); s.close(); print('SQLITE_BACKUP_OK')"
          else
            [ ! -f /data/mountainview.db ] || cp /data/mountainview.db /tmp/rotator-recovery/mountainview.db
            [ ! -f /data/mountainview.db-wal ] || cp /data/mountainview.db-wal /tmp/rotator-recovery/mountainview.db-wal
            [ ! -f /data/mountainview.db-shm ] || cp /data/mountainview.db-shm /tmp/rotator-recovery/mountainview.db-shm
            echo DIRECT_DB_AND_WAL_COPY
          fi
          find /data -xdev -maxdepth 4 -type d \( -path /data/repos -o -path /data/codex-fixer -o -path /data/operations-evidence \) -prune -o -type f -size -100M \( -iname "*.json" -o -iname "*.jsonl" -o -iname "*.db" -o -iname "*.sqlite" -o -iname "*.sqlite3" -o -iname "*.yaml" -o -iname "*.yml" -o -iname "*.toml" \) ! -iname "*token*" ! -iname "*api-key*" ! -iname "*secret*" ! -iname "*vault*" ! -iname "*key*" -print > /tmp/rotator-recovery-files.txt 2>/dev/null || true
          while IFS= read -r f; do [ -n "$f" ] && cp --parents "$f" /tmp/rotator-recovery/ 2>/dev/null || true; done < /tmp/rotator-recovery-files.txt
          tar -czf /tmp/rotator-recovery.tar.gz -C /tmp/rotator-recovery .
          tar -tzf /tmp/rotator-recovery.tar.gz > /tmp/rotator-recovery-list.txt
          REMOTE
          encoded_rotator="$(base64 -w0 /tmp/rotator-pack.sh)"
          if timeout 90s flyctl ssh console --app "$APP" --machine "$MACHINE" --command "sh -c 'echo $encoded_rotator | base64 -d > /tmp/rotator-pack.sh; sh /tmp/rotator-pack.sh'" --quiet </dev/null > logs/rotator-pack.out 2> logs/rotator-pack.err; then
            if timeout 180s flyctl ssh sftp get /tmp/rotator-recovery.tar.gz recovered/rotator/data/rotator-state.tar.gz --app "$APP" --machine "$MACHINE" --quiet </dev/null > logs/rotator-sftp.out 2> logs/rotator-sftp.err; then
              tar -tzf recovered/rotator/data/rotator-state.tar.gz > recovered/rotator/data/ARCHIVE-CONTENTS.txt
              sha256sum recovered/rotator/data/rotator-state.tar.gz > recovered/rotator/data/SHA256SUMS
              echo "Rotator state archive downloaded (credential/key files excluded)." | tee recovered/rotator/data/RESULT.txt
            else
              echo "Rotator archive download failed." > recovered/rotator/data/RESULT.txt
            fi
          else
            echo "Rotator archive creation failed." > recovered/rotator/data/RESULT.txt
            cat logs/rotator-pack.err || true
          fi

          if ! command -v sqlite3 >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3; fi
          mkdir -p /tmp/aetherra-check /tmp/rotator-check
          if [ -s recovered/aetherra/data/aetherra-state.tar.gz ]; then
            tar -xzf recovered/aetherra/data/aetherra-state.tar.gz -C /tmp/aetherra-check
            echo "=== Aetherra archive contents ==="
            cat recovered/aetherra/data/ARCHIVE-CONTENTS.txt
            if [ -s /tmp/aetherra-check/aetherra.db ] && command -v sqlite3 >/dev/null 2>&1; then
              sqlite3 /tmp/aetherra-check/aetherra.db 'PRAGMA integrity_check;' > recovered/aetherra/data/SQLITE-INTEGRITY.txt 2>&1 || true
              cat recovered/aetherra/data/SQLITE-INTEGRITY.txt
            fi
          fi
          if [ -s recovered/rotator/data/rotator-state.tar.gz ]; then
            tar -xzf recovered/rotator/data/rotator-state.tar.gz -C /tmp/rotator-check
            echo "=== Rotator archive contents ==="
            cat recovered/rotator/data/ARCHIVE-CONTENTS.txt
            if [ -s /tmp/rotator-check/mountainview.db ] && command -v sqlite3 >/dev/null 2>&1; then
              sqlite3 /tmp/rotator-check/mountainview.db 'PRAGMA integrity_check;' > recovered/rotator/data/SQLITE-INTEGRITY.txt 2>&1 || true
              cat recovered/rotator/data/SQLITE-INTEGRITY.txt
            fi
          fi

          echo "=== SpaceMountainLive ==="
          cat recovered/spacemountain/TARGET.txt
          cat recovered/spacemountain/FAILED.txt 2>/dev/null || true
          cat logs/spacemountain-db.err 2>/dev/null || true
          echo "=== MikaBot ==="
          cat recovered/mika-bot/TARGET.txt recovered/mika-bot/RECOVERY-REPORT.txt 2>/dev/null || true
          cat recovered/mika-bot/FAILED.txt 2>/dev/null || true
          echo "=== Aetherra inventory ==="
          cat recovered/aetherra/TARGET.txt recovered/aetherra/INVENTORY.txt recovered/aetherra/INVENTORY-ERROR.txt 2>/dev/null || true
          echo "=== Rotator inventory ==="
          cat recovered/rotator/TARGET.txt recovered/rotator/INVENTORY.txt recovered/rotator/INVENTORY-ERROR.txt 2>/dev/null || true
          find recovered -type f -printf '%s %p\\n' | sort -nr > recovered/FILE-SIZES.txt
          echo "captured_at=$(date -u +%FT%TZ)" > recovered/RECOVERY-REPORT.txt
      - name: Upload auxiliary recovery results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auxiliary-app-state-${{ github.run_id }}
          path: |
            recovered/**
            logs/**
          retention-days: 90
          if-no-files-found: warn
