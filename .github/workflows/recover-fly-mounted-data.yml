name: Recover all mounted Fly volume data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-fly-mounted-data.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Export mounted data from every app machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_MAIN || secrets.FLY_API_TOKEN }}
          RECOVERY_KEY: ${{ secrets.SPMT_ADMIN_RECOVERY_KEY || secrets.FLY_API_TOKEN_MAIN || secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/fly-mounted/encrypted /tmp/fly-mounted/raw
          : > /tmp/fly-mounted/results.jsonl
          if [ -z "${FLY_API_TOKEN:-}" ] || [ -z "${RECOVERY_KEY:-}" ]; then
            echo '{"status":"blocked","reason":"Fly access or recovery key secret missing"}' > /tmp/fly-mounted/report.json
            exit 1
          fi
          if ! timeout 20s flyctl apps list --json > /tmp/fly-mounted/apps.json 2>/tmp/fly-mounted/apps.err; then
            err="$(head -c 500 /tmp/fly-mounted/apps.err | tr '\n' ' ')"
            jq -nc --arg error "$err" '{status:"blocked",stage:"apps_list",error:$error}' > /tmp/fly-mounted/report.json
            exit 1
          fi
          if ! jq -e 'type=="array"' /tmp/fly-mounted/apps.json >/dev/null 2>&1; then
            echo '{"status":"blocked","stage":"apps_list","reason":"App list was not valid JSON"}' > /tmp/fly-mounted/report.json
            exit 1
          fi

          jq -r '.[] | (.Name // .name // .app_name // empty)' /tmp/fly-mounted/apps.json |
          while IFS= read -r app; do
            [ -n "$app" ] || continue
            safe_app="$(printf '%s' "$app" | tr -cd 'A-Za-z0-9._-')"
            echo "Inspecting $safe_app"
            if ! timeout 15s flyctl machines list --app "$app" --json > "/tmp/fly-mounted/raw/machines-$safe_app.json" 2>"/tmp/fly-mounted/raw/machines-$safe_app.err"; then
              err="$(head -c 300 "/tmp/fly-mounted/raw/machines-$safe_app.err" | tr '\n' ' ')"
              jq -nc --arg app "$safe_app" --arg error "$err" '{app:$app,status:"machine_inventory_failed",error:$error}' >> /tmp/fly-mounted/results.jsonl
              continue
            fi
            if ! jq -e 'type=="array"' "/tmp/fly-mounted/raw/machines-$safe_app.json" >/dev/null 2>&1; then
              jq -nc --arg app "$safe_app" '{app:$app,status:"machine_inventory_invalid_json"}' >> /tmp/fly-mounted/results.jsonl
              continue
            fi

            while IFS= read -r machine_row <&3; do
              machine="$(printf '%s' "$machine_row" | jq -r '.id // empty')"
              state="$(printf '%s' "$machine_row" | jq -r '.state // ""')"
              [ -n "$machine" ] || continue
              mounts="$(printf '%s' "$machine_row" | jq -c '.mounts // []')"
              paths="$(printf '%s' "$mounts" | jq -r '.[].path // empty' | while IFS= read -r p; do
                case "$p" in /*) p="${p#/}";; *) continue;; esac
                case "/$p/" in */../*|*/./*) continue;; esac
                case "$p" in *[!A-Za-z0-9._/-]*) continue;; esac
                printf '%s\n' "$p"
              done | sort -u)"
              if [ -z "$paths" ]; then
                jq -nc --arg app "$safe_app" --arg machine "$machine" --arg state "$state" '{app:$app,machine:$machine,state:$state,status:"no_mount_paths_reported"}' >> /tmp/fly-mounted/results.jsonl
                continue
              fi

              original_state="$state"
              if [ "$state" = "stopped" ] || [ "$state" = "suspended" ]; then
                echo "Temporarily starting $safe_app/$machine (original state: $state)"
                if ! timeout 30s flyctl machine start "$machine" --app "$app" >"/tmp/fly-mounted/raw/start-$machine.out" 2>"/tmp/fly-mounted/raw/start-$machine.err"; then
                  err="$(head -c 300 "/tmp/fly-mounted/raw/start-$machine.err" | tr '\n' ' ')"
                  jq -nc --arg app "$safe_app" --arg machine "$machine" --arg error "$err" '{app:$app,machine:$machine,status:"start_failed",error:$error}' >> /tmp/fly-mounted/results.jsonl
                  continue
                fi
                sleep 8
              fi

              remote="/tmp/fly-recovery-$machine.tar.gz"
              remote_cmd="tar -czf $remote -C /"
              while IFS= read -r p; do [ -n "$p" ] && remote_cmd="$remote_cmd $p"; done <<< "$paths"
              stdout="/tmp/fly-mounted/raw/ssh-$machine.out"
              stderr="/tmp/fly-mounted/raw/ssh-$machine.err"
              if ! timeout 90s flyctl ssh console --app "$app" --machine "$machine" --command "$remote_cmd" --quiet </dev/null >"$stdout" 2>"$stderr"; then
                err="$(head -c 500 "$stderr" | tr '\n' ' ')"
                jq -nc --arg app "$safe_app" --arg machine "$machine" --arg state "$original_state" --arg error "$err" '{app:$app,machine:$machine,original_state:$state,status:"remote_archive_failed",error:$error}' >> /tmp/fly-mounted/results.jsonl
                if [ "$original_state" = "stopped" ]; then timeout 20s flyctl machine stop "$machine" --app "$app" >/dev/null 2>&1 || true; fi
                if [ "$original_state" = "suspended" ]; then timeout 20s flyctl machine suspend "$machine" --app "$app" >/dev/null 2>&1 || true; fi
                continue
              fi

              local_archive="/tmp/fly-mounted/raw/$safe_app-$machine.tar.gz"
              if ! timeout 180s flyctl ssh sftp get "$remote" "$local_archive" --app "$app" --machine "$machine" --quiet </dev/null >"/tmp/fly-mounted/raw/sftp-$machine.out" 2>"/tmp/fly-mounted/raw/sftp-$machine.err"; then
                err="$(head -c 500 "/tmp/fly-mounted/raw/sftp-$machine.err" | tr '\n' ' ')"
                jq -nc --arg app "$safe_app" --arg machine "$machine" --arg error "$err" '{app:$app,machine:$machine,status:"archive_download_failed",error:$error}' >> /tmp/fly-mounted/results.jsonl
                if [ "$original_state" = "stopped" ]; then timeout 20s flyctl machine stop "$machine" --app "$app" >/dev/null 2>&1 || true; fi
                if [ "$original_state" = "suspended" ]; then timeout 20s flyctl machine suspend "$machine" --app "$app" >/dev/null 2>&1 || true; fi
                continue
              fi

              if ! tar -tzf "$local_archive" > "/tmp/fly-mounted/raw/files-$machine.txt" 2>"/tmp/fly-mounted/raw/tar-$machine.err"; then
                jq -nc --arg app "$safe_app" --arg machine "$machine" '{app:$app,machine:$machine,status:"archive_integrity_failed"}' >> /tmp/fly-mounted/results.jsonl
                continue
              fi
              file_count="$(wc -l < "/tmp/fly-mounted/raw/files-$machine.txt" | tr -d ' ')"
              plain_bytes="$(stat -c '%s' "$local_archive")"
              node - "$local_archive" "/tmp/fly-mounted/encrypted/$safe_app-$machine.tar.gz.enc" <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const { pipeline } = require('node:stream/promises');
          (async () => {
            const [src, dst] = process.argv.slice(2);
            const pass = process.env.RECOVERY_KEY;
            if (!pass) throw new Error('Recovery encryption key unavailable');
            const salt = crypto.randomBytes(16), iv = crypto.randomBytes(12);
            const key = crypto.scryptSync(pass, salt, 32, { N: 32768, r: 8, p: 1, maxmem: 128 * 1024 * 1024 });
            const cipher = crypto.createCipheriv('aes-256-gcm', key, iv);
            const out = fs.createWriteStream(dst, { mode: 0o600 });
            out.write(Buffer.concat([Buffer.from('SPMTFLY1'), salt, iv]));
            await pipeline(fs.createReadStream(src), cipher, out);
            fs.appendFileSync(dst, cipher.getAuthTag());
            fs.unlinkSync(src);
          })().catch(e => { process.stderr.write(String(e.message || e)); process.exitCode = 1; });
          NODE
              if [ -s "/tmp/fly-mounted/encrypted/$safe_app-$machine.tar.gz.enc" ]; then
                sha="$(sha256sum "/tmp/fly-mounted/encrypted/$safe_app-$machine.tar.gz.enc" | awk '{print $1}')"
                enc_bytes="$(stat -c '%s' "/tmp/fly-mounted/encrypted/$safe_app-$machine.tar.gz.enc")"
                jq -nc --arg app "$safe_app" --arg machine "$machine" --arg file "$safe_app-$machine.tar.gz.enc" --arg sha256 "$sha" --argjson bytes "$enc_bytes" --argjson plainBytes "$plain_bytes" --argjson fileCount "$file_count" '{app:$app,machine:$machine,file:$file,sha256:$sha256,encrypted_bytes:$bytes,archive_bytes:$plainBytes,file_count:$fileCount,status:"encrypted_archive_created"}' >> /tmp/fly-mounted/results.jsonl
              else
                jq -nc --arg app "$safe_app" --arg machine "$machine" '{app:$app,machine:$machine,status:"encryption_failed"}' >> /tmp/fly-mounted/results.jsonl
              fi

              flyctl ssh console --app "$app" --machine "$machine" --command "rm -f $remote" --quiet </dev/null >/dev/null 2>&1 || true
              if [ "$original_state" = "stopped" ]; then timeout 20s flyctl machine stop "$machine" --app "$app" >/dev/null 2>&1 || true; fi
              if [ "$original_state" = "suspended" ]; then timeout 20s flyctl machine suspend "$machine" --app "$app" >/dev/null 2>&1 || true; fi
            done 3< <(jq -c '.[] | {id:(.id // .ID),state:(.state // .State // ""),mounts:(.config.mounts // [])}' "/tmp/fly-mounted/raw/machines-$safe_app.json")
          done

          jq -s '.' /tmp/fly-mounted/results.jsonl > /tmp/fly-mounted/results.json 2>/dev/null || echo '[]' > /tmp/fly-mounted/results.json
          jq -n --slurpfile apps /tmp/fly-mounted/apps.json --slurpfile results /tmp/fly-mounted/results.json '{
            capturedAt:(now|todate),
            appsDiscovered:($apps[0]|length),
            machineResults:$results[0],
            encryptedArchivesCreated:([$results[0][]|select(.status=="encrypted_archive_created")]|length),
            failures:([$results[0][]|select(.status|test("failed|no_mount";"i"))]|length),
            encryption:"AES-256-GCM; scrypt-derived key from SPMT_ADMIN_RECOVERY_KEY when configured, otherwise FLY_API_TOKEN"
          }' > /tmp/fly-mounted/report.json || echo '{"status":"partial","reason":"Could not aggregate machine results"}' > /tmp/fly-mounted/report.json
          cat /tmp/fly-mounted/report.json

      - name: Upload encrypted mounted-data archives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fly-mounted-data-recovery
          path: /tmp/fly-mounted/encrypted/*.enc
          retention-days: 90
          if-no-files-found: warn

      - name: Upload recovery report and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fly-mounted-data-manifest
          path: |
            /tmp/fly-mounted/report.json
            /tmp/fly-mounted/results.json
            /tmp/fly-mounted/raw/*.err
          retention-days: 90
          if-no-files-found: warn
