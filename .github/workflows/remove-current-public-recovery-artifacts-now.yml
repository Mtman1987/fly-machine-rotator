name: Immediately remove current public recovery artifacts
# Re-triggered after later recovery artifacts were published

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/remove-current-public-recovery-artifacts-now.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  delete-current:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete all current artifacts from recovery runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for run_id in 40070021676 40070125847 40070315949; do
            echo "Deleting currently published artifacts for run=$run_id"
            artifact_ids="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" --jq '.artifacts[].id' 2>/dev/null || true)"
            while IFS= read -r artifact_id; do
              [ -n "$artifact_id" ] || continue
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
              echo "Deleted artifact=$artifact_id"
            done <<< "$artifact_ids"
          done
          echo "Current public recovery artifacts deletion attempted."
