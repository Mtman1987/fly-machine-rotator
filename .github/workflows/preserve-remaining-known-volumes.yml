name: Preserve remaining known Fly volumes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/preserve-remaining-known-volumes.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preserve-remaining-known-volumes
  cancel-in-progress: false

jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Discover app ownership and fork remaining known volumes
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_MAIN || secrets.FLY_API_TOKEN }}
        run: |
          set -uo pipefail
          mkdir -p results
          printf 'volume_id\tapp\tresult\tdetail\n' > results/remaining-volumes.tsv
          if [ -z "${FLY_API_TOKEN:-}" ]; then echo "::error::Fly API token secret missing"; exit 1; fi
          cat > /tmp/targets.tsv <<'EOF'
          vol_v8ee73j6wglewp7v
          vol_vlyw1nmy2w7pk3o4
          vol_4ojp7nl276l6ke2r
          vol_4oj19geyd6knd0or
          vol_491xedonwmk6zx9r
          vol_4ojg8nld8zqqx6qr
          EOF
          timeout 30s flyctl apps list --json > /tmp/apps.json
          failures=0
          while IFS= read -r target; do
            [ -n "$target" ] || continue
            found_app=""
            while IFS= read -r app; do
              [ -n "$app" ] || continue
              if timeout 20s flyctl volumes list -a "$app" --json > /tmp/volumes.json 2>/dev/null; then
                if jq -e --arg id "$target" 'any(.[]; (.id // .ID // "") == $id)' /tmp/volumes.json >/dev/null 2>&1; then
                  found_app="$app"
                  break
                fi
              fi
            done < <(jq -r '.[] | (.Name // .name // .app_name // empty)' /tmp/apps.json)
            if [ -z "$found_app" ]; then
              printf '%s\t\tNOT_FOUND\tapp ownership not returned by flyctl volumes list\n' "$target" >> results/remaining-volumes.tsv
              failures=$((failures+1))
              continue
            fi
            echo "Preserving $target in $found_app"
            output="$(printf 'y\n' | timeout 240s flyctl volumes fork "$target" -a "$found_app" --name recovery_extra 2>&1)"
            rc=$?
            printf '%s\n' "$output"
            if [ "$rc" -eq 0 ]; then
              printf '%s\t%s\tCREATED\t%s\n' "$target" "$found_app" "$(printf '%s' "$output" | tr '\t\n' '  ' | cut -c1-700)" >> results/remaining-volumes.tsv
            else
              printf '%s\t%s\tFAILED_exit_%s\t%s\n' "$target" "$found_app" "$rc" "$(printf '%s' "$output" | tr '\t\n' '  ' | cut -c1-700)" >> results/remaining-volumes.tsv
              failures=$((failures+1))
            fi
          done < /tmp/targets.tsv
          cat results/remaining-volumes.tsv
          [ "$failures" -eq 0 ]
      - name: Save preservation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fly-remaining-volume-preservation-${{ github.run_id }}
          path: results/remaining-volumes.tsv
          retention-days: 90
          if-no-files-found: error
