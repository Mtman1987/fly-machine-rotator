name: Verify OpenAI routing (legacy bridge)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run test/publicCodexFixer.test.ts test/athenaCoderV2.test.ts
      - name: Check low-cost defaults and explicit local opt-in
        run: |
          grep -q 'gpt-4o-mini' src/athenaChat.ts
          grep -q 'CODEX_FIXER_PROVIDER === "qwen"' src/publicCodexFixer.ts
          grep -q 'ATHENA_CHAT_LOCAL_ENABLED === "true"' src/athenaChat.ts
