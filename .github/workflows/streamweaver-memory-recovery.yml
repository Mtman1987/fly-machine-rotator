name: StreamWeaver memory recovery
on:
  push:
    branches: [main]
    paths: [.github/workflows/streamweaver-memory-recovery.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - name: Restore memory headroom on the existing StreamWeaver machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          python3 <<'PY'
          import json, subprocess
          app = 'streamweaver-new'
          rows = json.loads(subprocess.check_output(['flyctl','machines','list','--app',app,'--json']))
          assert len(rows) == 1, 'Expected the existing single StreamWeaver machine'
          machine = rows[0]
          assert machine['id'] == '080e967ea95558', 'Unexpected recovery target'
          guest = machine['config']['guest']
          assert guest['cpu_kind'] == 'shared' and guest['cpus'] == 2
          if guest['memory_mb'] < 4096:
              subprocess.run(['flyctl','machine','update',machine['id'],'--app',app,'--memory','4096','--cpus','2','--vm-cpu-kind','shared','--yes'],check=True,timeout=240)
          current = json.loads(subprocess.check_output(['flyctl','machines','list','--app',app,'--json']))
          g = current[0]['config']['guest']
          assert g['cpu_kind'] == 'shared' and g['cpus'] == 2 and g['memory_mb'] >= 4096
          print(json.dumps({'app':app,'machineId':machine['id'],'guest':g}))
          PY
      - name: Read health and storage after recovery
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl checks list --app streamweaver-new
          flyctl volumes list --app streamweaver-new
          flyctl ssh console --app streamweaver-new --machine 080e967ea95558 --command 'df -h /data' --quiet
      - name: Measure public API response times without publishing response content
        run: |
          python3 <<'PY'
          import json, time, urllib.request
          targets = [
            'https://streamweaver-new.fly.dev/api/health',
            'https://streamweaver-new.fly.dev/api/shared-chat/featured?tenant=spacemountainlive&fallback=latest',
            'https://chat-tag-new.fly.dev/api/health',
            'https://chat-tag-new.fly.dev/api/tag',
            'https://chat-tag-new.fly.dev/api/game-hub/channel?channel=spacemountainlive',
          ]
          for url in targets:
              started = time.monotonic()
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      response.read()
                      status = response.status
              except urllib.error.HTTPError as error:
                  status = error.code
              except Exception:
                  status = 0
              print(json.dumps({'url':url,'status':status,'elapsedMs':round((time.monotonic()-started)*1000)}))
          PY
      - name: Increase Chat Tag web RAM headroom on its existing shared CPU machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          python3 <<'PY'
          import json, subprocess
          app='chat-tag-new'
          rows=json.loads(subprocess.check_output(['flyctl','machines','list','--app',app,'--json']))
          assert len(rows)==1 and rows[0]['id']=='d892e7ec137ed8'
          g=rows[0]['config']['guest']
          assert g['cpu_kind']=='shared' and g['cpus']==2
          if g['memory_mb']<2048:
              subprocess.run(['flyctl','machine','update',rows[0]['id'],'--app',app,'--memory','2048','--cpus','2','--vm-cpu-kind','shared','--yes'],check=True,timeout=240)
          print('Chat Tag web now has 2 GB RAM on two shared CPUs.')
          PY
