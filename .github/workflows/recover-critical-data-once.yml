name: One-time critical data recovery via Rotator token

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-critical-data-once.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-spmt-live:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Export and encrypt spmt-live
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_MAIN || secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FLY_API_TOKEN:-}" ]; then echo "No Fly API token configured"; exit 1; fi
          printf '%s\\n' '-----BEGIN PUBLIC KEY-----' '' '-----END PUBLIC KEY-----' > /tmp/export-public.pem
          timeout 360s flyctl ssh console --app spmt-live -C "sh -c 'tar -cf - -C /data . | gzip -1 | base64'" > /tmp/data.b64
          base64 -d /tmp/data.b64 > /tmp/spmt-live-data.tar.gz
          tar -tzf /tmp/spmt-live-data.tar.gz > /tmp/spmt-live-file-list.txt
          echo "Archive entries: $(wc -l < /tmp/spmt-live-file-list.txt); bytes: $(wc -c < /tmp/spmt-live-data.tar.gz)"
          openssl rand -hex 32 > /tmp/recovery-password
          openssl enc -aes-256-cbc -salt -pbkdf2 -in /tmp/spmt-live-data.tar.gz -out /tmp/spmt-live-data.tar.gz.enc -pass file:/tmp/recovery-password
          openssl pkeyutl -encrypt -pubin -inkey /tmp/export-public.pem -in /tmp/recovery-password -out /tmp/spmt-live-data.key.enc
          rm -f /tmp/data.b64 /tmp/spmt-live-data.tar.gz /tmp/recovery-password
      - name: Upload encrypted archive
        uses: actions/upload-artifact@v4
        with:
          name: recovery-spmt-live-encrypted
          path: |
            /tmp/spmt-live-data.tar.gz.enc
            /tmp/spmt-live-data.key.enc
            /tmp/spmt-live-file-list.txt
          retention-days: 1
          if-no-files-found: error
  export-hmo-dj-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Export and encrypt hmo-dj-worker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_MAIN || secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FLY_API_TOKEN:-}" ]; then echo "No Fly API token configured"; exit 1; fi
          printf '%s\\n' '-----BEGIN PUBLIC KEY-----' '' '-----END PUBLIC KEY-----' > /tmp/export-public.pem
          timeout 360s flyctl ssh console --app hmo-dj-worker -C "sh -c 'tar -cf - -C /data . | gzip -1 | base64'" > /tmp/data.b64
          base64 -d /tmp/data.b64 > /tmp/hmo-dj-worker-data.tar.gz
          tar -tzf /tmp/hmo-dj-worker-data.tar.gz > /tmp/hmo-dj-worker-file-list.txt
          echo "Archive entries: $(wc -l < /tmp/hmo-dj-worker-file-list.txt); bytes: $(wc -c < /tmp/hmo-dj-worker-data.tar.gz)"
          openssl rand -hex 32 > /tmp/recovery-password
          openssl enc -aes-256-cbc -salt -pbkdf2 -in /tmp/hmo-dj-worker-data.tar.gz -out /tmp/hmo-dj-worker-data.tar.gz.enc -pass file:/tmp/recovery-password
          openssl pkeyutl -encrypt -pubin -inkey /tmp/export-public.pem -in /tmp/recovery-password -out /tmp/hmo-dj-worker-data.key.enc
          rm -f /tmp/data.b64 /tmp/hmo-dj-worker-data.tar.gz /tmp/recovery-password
      - name: Upload encrypted archive
        uses: actions/upload-artifact@v4
        with:
          name: recovery-hmo-dj-worker-encrypted
          path: |
            /tmp/hmo-dj-worker-data.tar.gz.enc
            /tmp/hmo-dj-worker-data.key.enc
            /tmp/hmo-dj-worker-file-list.txt
          retention-days: 1
          if-no-files-found: error
