name: Agents failure classification
on:
  push:
    branches: [diagnose/chat-tag-fleet-20261006]
    paths: [.github/workflows/agents-failure-classification.yml, scripts/agents-failure-classification.mjs]
permissions:
  contents: read
jobs:
  classify:
    if: github.actor == 'Mtman1987'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Classify retained agent errors
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: node scripts/agents-failure-classification.mjs
