# Diagnostic trigger: 2026-09-21 post-warmup !sr failure
name: Manual Rotator Smoke
on:
  push:
    branches: [main]
    paths: [".github/workflows/manual-rotator-smoke.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: manual-rotator-smoke
  cancel-in-progress: false
jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch'
    name: Read current machine states, logs, and Rotator ledgers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Capture bounded read-only diagnostics
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN"
          mkdir -p diagnostics
          redact() {
            FILE="$1" node --import tsx --input-type=module -e '
              import fs from "node:fs";
              import { redactSensitiveText } from "./src/redaction.ts";
              const p = process.env.FILE;
              let raw = fs.readFileSync(p, "utf8");
              if (p.endsWith("-machines.txt")) {
                try {
                  raw = JSON.stringify(JSON.parse(raw).map(m => ({id:m.id,state:m.state,region:m.region,guest:m.config?.guest,checks:m.checks})), null, 2);
                } catch { raw = "Machine state could not be decoded; inspect the capture exit status."; }
              }
              const sanitized = redactSensitiveText(raw).split(process.env.FLY_API_TOKEN).join("[REDACTED]");
              fs.writeFileSync(p, sanitized);
            '
          }
          capture() {
            file="$1"
            shift
            if timeout 45s "$@" > "$file" 2>&1; then
              echo "$file ok" > "$file.result"
            else
              code=$?
              echo "$file FAILED exit=$code" > "$file.result"
            fi
            redact "$file"
          }
          export -f redact capture
          capture diagnostics/apps.txt flyctl apps list -q -o mtman-new
          if grep -q FAILED diagnostics/apps.txt.result; then
            cat diagnostics/apps.txt
            exit 1
          fi
          # Four readers; a stuck app cannot block the rest of the fleet.
          sed 's/^[[:space:]]*//;s/[[:space:]]*$//;/^$/d' diagnostics/apps.txt | xargs -r -P4 -I{} bash -c '
            set -euo pipefail
            app="$1"
            [[ "$app" =~ ^[A-Za-z0-9_-]+$ ]] || exit 1
            capture "diagnostics/$app-machines.txt" flyctl machine list -a "$app" --json
            if FILE="diagnostics/$app-machines.txt" node -e "const fs=require(\"fs\");const rows=JSON.parse(fs.readFileSync(process.env.FILE,\"utf8\"));process.exit(rows.some(m=>m.state===\"started\")?0:1)"; then
              capture "diagnostics/$app-logs.txt" flyctl logs -a "$app" --json --no-tail
            else
              echo "$app logs skipped: no running machine" > "diagnostics/$app-logs.txt.result"
            fi
          ' _ '{}'
          # Probe Apollo's public Sprite surface without mutating room or queue state.
          capture diagnostics/apollo-sprite-root.txt curl --silent --show-error --max-time 30 --dump-header - --output - --write-out '\nHTTP_STATUS=%{http_code}\n' https://web-terminal-bvesa.sprites.app/
          capture diagnostics/apollo-sprite-lounge-state.txt curl --silent --show-error --max-time 30 --dump-header - --output - --write-out '\nHTTP_STATUS=%{http_code}\n' 'https://web-terminal-bvesa.sprites.app/api/watch/broadcast/state?roomId=system-spacemountainlive-lounge'
          # Read existing state only: no start, rotation, model call, or repair submission.
          capture diagnostics/rotator-ledgers.jsonl flyctl ssh console -a mtman-machine-rotator --command 'node --input-type=module -e "import fs from \"node:fs\";import {redactSensitiveText} from \"/app/dist/redaction.js\";console.log(JSON.stringify({managedApps:process.env.FLY_ROTATOR_APPS||process.env.MANAGED_FLY_APPS}));for(const name of [\"error-history.json\",\"observed-incidents.json\",\"error-baseline.json\",\"runtime-state.json\",\"hourly-repair-cycles.json\"]){try{const path=\"/data/\"+name;const size=fs.statSync(path).size;console.log(JSON.stringify({file:name,bytes:size}));if(size>25000000)throw new Error(\"ledger-too-large\");const data=JSON.parse(fs.readFileSync(path,\"utf8\"));const rows=Array.isArray(data)?data.slice(-50).map(r=>({recordedAt:r.recordedAt,appName:r.appName,status:r.status,message:String(r.message||r.summary||\"\").slice(0,700),classification:r.classification,startedAt:r.startedAt,finishedAt:r.finishedAt})):data;console.log(redactSensitiveText(JSON.stringify({file:name,total:Array.isArray(data)?data.length:undefined,data:rows})))}catch(e){console.log(JSON.stringify({file:name,readError:e.code||e.message}));process.exitCode=1}}" '
          cat diagnostics/*.result
          for app in mtman-machine-rotator apollo-station apollo-station-new streamweaver-new discord-stream-hub-new spmt-llm-worker; do
            for file in diagnostics/"$app"-*.txt; do
              [ -f "$file" ] || continue
              echo "FILE $file"
              tail -n 30 "$file"
            done
          done
          if grep -q FAILED diagnostics/*.result; then
            echo 'Diagnostic coverage is incomplete; inspect failed captures in the artifact.'
            exit 1
          fi
      - name: Preserve sanitized diagnostics even when a capture fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rotator-live-diagnostics
          path: diagnostics/
          retention-days: 1
          if-no-files-found: error

  recover-terminal:
    name: Recover SPMTFly saved credential without exporting secrets
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: spmt-fly-production-mutation
      cancel-in-progress: false
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - name: Restart original Sprite and restore saved authentication
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          python3 <<'PY'
          import os,json,urllib.request,urllib.parse,urllib.error,subprocess,time,sys
          BASE='https://api.sprites.dev'
          SOURCE='web-terminal'
          DEST='spmt-ops-recovery'
          EXPECTED={'web-terminal':'sprite-2249fee2-ecf3-4b10-8bc1-314f4b9e5bcc','spmt-ops-recovery':'sprite-4bd76345-15a1-43ed-811f-9a3ee4618df8'}
          fly=os.environ['FLY_API_TOKEN']
          def request(path,token,method='GET',data=None,timeout=45,auth='Bearer'):
              headers={'Authorization':auth+' '+token}
              if isinstance(data,dict):data=json.dumps(data).encode();headers['Content-Type']='application/json'
              req=urllib.request.Request(BASE+path,data=data,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:return r.status,r.read()
              except urllib.error.HTTPError as e:return e.code,b''
              except Exception:return 0,b''
          import base64
          source="(()=>{const fs=require('fs'),path=require('path');const found=[];let visited=0;const walk=(root,depth)=>{if(depth>5||visited>5000)return;let rows;try{rows=fs.readdirSync(root,{withFileTypes:true})}catch{return}for(const row of rows){visited++;const p=path.join(root,row.name);if(row.isSymbolicLink())continue;if(row.isDirectory()){if(!['repos','codex-fixer','node_modules','jobs','.git','sandboxes'].includes(row.name))walk(p,depth+1)}else if(/fly.*(?:token|config)|(?:token.*fly)|^config\\.ya?ml$/i.test(row.name))found.push({path:p,bytes:fs.statSync(p).size});}};walk('/data',0);for(const p of ['/home/sprite/.fly/config.yml','/home/sprite/.fly/config.yaml','/home/sprite/.config/spmt/Fly token_update.txt']){if(fs.existsSync(p))found.push({path:p,bytes:fs.statSync(p).size})};console.log(JSON.stringify({phase:'rotator_volume_credential_metadata',dataMounted:fs.existsSync('/data'),runtimeFlyCredentialPresent:Boolean(process.env.FLY_API_TOKEN),runtimeSpriteCredentialPresent:Boolean(process.env.SPRITES_TOKEN||process.env.SPRITES_API_TOKEN||process.env.SPRITE_TOKEN),candidateFiles:found.slice(0,20),visited}));})();"
          command="node -e \"eval(Buffer.from('"+base64.b64encode(source.encode()).decode()+"','base64').toString('utf8'))\""
          probe=subprocess.run(['flyctl','ssh','console','--app','mtman-machine-rotator','--machine','2862e02c9263d8','--command',command,'--quiet'],capture_output=True,text=True,timeout=60)
          for line in probe.stdout.splitlines():
              if line.startswith('{'):print(line)
          if probe.returncode:sys.exit('rotator_volume_probe_failed')
          

          # Test the live rotator's own credential independently of Actions.
          runtimeSource="(async()=>{const token=process.env.FLY_API_TOKEN;if(!token)throw Error('missing_runtime_fly_credential');for(const [label,value]of [['official_sdk_format',token],['normalized_format',token.startsWith('FlyV1 ')?token.slice(6):token]]){const r=await fetch('https://api.sprites.dev/v1/organizations/mtman-new/tokens',{method:'POST',headers:{Authorization:'FlyV1 '+value,'content-type':'application/json'},body:JSON.stringify({description:'SPMTFly rotator terminal recovery'}),signal:AbortSignal.timeout(30000)});console.log(JSON.stringify({phase:'runtime_rotator_sprites_authorization',format:label,httpStatus:r.status}));if(r.ok){const b=await r.json();if(!b.token)throw Error('missing_sprite_credential');require('fs').writeFileSync('/data/spmtfly-sprites-token',b.token,{mode:0o600});console.log(JSON.stringify({phase:'runtime_sprite_auth_saved',path:'/data/spmtfly-sprites-token',mode:'0600'}));return;}}})().catch(()=>{console.log(JSON.stringify({phase:'runtime_rotator_auth_probe_failed'}));process.exitCode=1});"
          command="node -e \"eval(Buffer.from('"+base64.b64encode(runtimeSource.encode()).decode()+"','base64').toString('utf8'))\""
          runtimeProbe=subprocess.run(['flyctl','ssh','console','--app','mtman-machine-rotator','--machine','2862e02c9263d8','--command',command,'--quiet'],capture_output=True,text=True,timeout=90)
          for line in runtimeProbe.stdout.splitlines():
              if line.startswith('{'):print(line)

          # Use the rotator's existing Actions secret only inside this runner.
          macaroon=fly
          status,raw=request('/v1/organizations/mtman-new/tokens',macaroon,'POST',{'description':'SPMTFly terminal credential recovery'},auth='FlyV1')
          print(json.dumps({'phase':'sprites_authorization','httpStatus':status}))
          if status not in (200,201):sys.exit('sprites_authorization_failed')
          token=json.loads(raw).get('token')
          if not token:sys.exit('sprites_authorization_missing')
          # Immediately mask the minted credential; no secrets are exported as artifacts.
          print('::add-mask::'+token)
          for name in (SOURCE,DEST):
              status,raw=request('/v1/sprites/'+name,token)
              if status!=200 or json.loads(raw).get('id')!=EXPECTED[name]:sys.exit('sprite_identity_mismatch')
          status,raw=request('/v1/sprites/'+SOURCE+'/restart',token,'POST',timeout=60)
          print(json.dumps({'phase':'original_sprite_restart','httpStatus':status}))
          if status not in (200,201,202,204):sys.exit('sprite_restart_failed')
          # A restart preserves the filesystem. Never restore an older checkpoint.
          saved=None
          sourcePath=None
          paths=['/home/sprite/.fly/config.yml','/home/sprite/.fly/config.yaml','/home/sprite/.config/spmt/Fly token_update.txt']
          for attempt in range(3):
              for path in paths:
                  query=urllib.parse.urlencode({'path':path,'workingDir':'/'})
                  status,raw=request('/v1/sprites/'+SOURCE+'/fs/read?'+query,token,timeout=45)
                  print(json.dumps({'phase':'saved_credential_read','path':path,'httpStatus':status}))
                  if status==200:
                      text=raw.decode().strip()
                      import re
                      match=re.search(r'(?m)^\s*access_token\s*:\s*(.+?)\s*$',text)
                      value=match.group(1).strip().strip('"\'') if match else text
                      if value and not any(c in value for c in '\r\n') and len(value)>30:
                          saved=value;sourcePath=path;break
              if saved:break
              time.sleep(3)
          if not saved:sys.exit('saved_credential_unavailable_after_restart')
          print('::add-mask::'+saved)
          # Verify the recovered key against the target app before changing any secret.
          childEnv=dict(os.environ,FLY_API_TOKEN=saved)
          check=subprocess.run(['flyctl','machines','list','--app','mtman-machine-rotator','--json'],env=childEnv,capture_output=True,text=True,timeout=45)
          if check.returncode:sys.exit('recovered_fly_authentication_failed')
          try:machines=json.loads(check.stdout)
          except Exception:sys.exit('recovered_fly_inventory_invalid')
          if not any(m.get('id')=='2862e02c9263d8' for m in machines):sys.exit('rotator_identity_mismatch')
          config=('access_token: '+json.dumps(saved)+'\n').encode()
          query=urllib.parse.urlencode({'path':'/home/sprite/.fly/config.yml','workingDir':'/','mode':'0600','mkdirParents':'true'})
          status,raw=request('/v1/sprites/'+DEST+'/fs/write?'+query,token,'PUT',config)
          if status not in (200,201):sys.exit('replacement_credential_write_failed')
          # Install a wrapper that supplies saved auth internally even when HOME differs.
          wrapper=b'''#!/usr/bin/env node
          const fs=require('fs'),cp=require('child_process');
          const text=fs.readFileSync('/home/sprite/.fly/config.yml','utf8');
          const match=text.match(/^\\s*access_token\\s*:\\s*(.+)\\s*$/m);
          if(!match)process.exit(1);
          let value=match[1].trim();try{value=JSON.parse(value)}catch{value=value.replace(/^['"]|['"]$/g,'')}
          const result=cp.spawnSync('/home/sprite/.fly/bin/flyctl',process.argv.slice(2),{stdio:'inherit',env:{...process.env,FLY_API_TOKEN:value}});
          process.exit(result.status??1);
          '''
          # Existing flyctl-spmt is a symlink; delete only that link before replacing it.
          q=urllib.parse.urlencode({'path':'/home/sprite/ops/bin/flyctl-spmt','workingDir':'/'})
          status,raw=request('/v1/sprites/'+DEST+'/fs/delete?'+q,token,'DELETE')
          if status not in (200,204,404):sys.exit('wrapper_link_removal_failed')
          q=urllib.parse.urlencode({'path':'/home/sprite/ops/bin/flyctl-spmt','workingDir':'/','mode':'0700','mkdirParents':'true'})
          status,raw=request('/v1/sprites/'+DEST+'/fs/write?'+q,token,'PUT',wrapper)
          if status not in (200,201):sys.exit('wrapper_install_failed')
          # Reapply the recovered Fly credential to the owner's rotator app over stdin.
          # The service restarts only if Fly detects a secret change.
          update=subprocess.run(['flyctl','secrets','import','--app','mtman-machine-rotator'],input='FLY_API_TOKEN='+saved+'\n',env=dict(os.environ),capture_output=True,text=True,timeout=180)
          if update.returncode:sys.exit('fly_secret_restore_failed')
          print(json.dumps({'ok':True,'sourceSprite':SOURCE,'sourcePath':sourcePath,'destinationSprite':DEST,'configMode':'0600','flySecretApp':'mtman-machine-rotator','flySecretName':'FLY_API_TOKEN','recoveredAuthVerified':True}))
          
          PY
