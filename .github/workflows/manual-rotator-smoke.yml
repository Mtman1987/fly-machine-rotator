# Diagnostic trigger: 2026-09-21 post-warmup !sr failure
name: Manual Rotator Smoke
on:
  push:
    branches: [main]
    paths: [".github/workflows/manual-rotator-smoke.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: manual-rotator-smoke
  cancel-in-progress: false
jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch'
    name: Read current machine states, logs, and Rotator ledgers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Capture bounded read-only diagnostics
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN"
          mkdir -p diagnostics
          redact() {
            FILE="$1" node --import tsx --input-type=module -e '
              import fs from "node:fs";
              import { redactSensitiveText } from "./src/redaction.ts";
              const p = process.env.FILE;
              let raw = fs.readFileSync(p, "utf8");
              if (p.endsWith("-machines.txt")) {
                try {
                  raw = JSON.stringify(JSON.parse(raw).map(m => ({id:m.id,state:m.state,region:m.region,guest:m.config?.guest,checks:m.checks})), null, 2);
                } catch { raw = "Machine state could not be decoded; inspect the capture exit status."; }
              }
              const sanitized = redactSensitiveText(raw).split(process.env.FLY_API_TOKEN).join("[REDACTED]");
              fs.writeFileSync(p, sanitized);
            '
          }
          capture() {
            file="$1"
            shift
            if timeout 45s "$@" > "$file" 2>&1; then
              echo "$file ok" > "$file.result"
            else
              code=$?
              echo "$file FAILED exit=$code" > "$file.result"
            fi
            redact "$file"
          }
          export -f redact capture
          capture diagnostics/apps.txt flyctl apps list -q -o mtman-new
          if grep -q FAILED diagnostics/apps.txt.result; then
            cat diagnostics/apps.txt
            exit 1
          fi
          # Four readers; a stuck app cannot block the rest of the fleet.
          sed 's/^[[:space:]]*//;s/[[:space:]]*$//;/^$/d' diagnostics/apps.txt | xargs -r -P4 -I{} bash -c '
            set -euo pipefail
            app="$1"
            [[ "$app" =~ ^[A-Za-z0-9_-]+$ ]] || exit 1
            capture "diagnostics/$app-machines.txt" flyctl machine list -a "$app" --json
            if FILE="diagnostics/$app-machines.txt" node -e "const fs=require(\"fs\");const rows=JSON.parse(fs.readFileSync(process.env.FILE,\"utf8\"));process.exit(rows.some(m=>m.state===\"started\")?0:1)"; then
              capture "diagnostics/$app-logs.txt" flyctl logs -a "$app" --json --no-tail
            else
              echo "$app logs skipped: no running machine" > "diagnostics/$app-logs.txt.result"
            fi
          ' _ '{}'
          # Probe Apollo's public Sprite surface without mutating room or queue state.
          capture diagnostics/apollo-sprite-root.txt curl --silent --show-error --max-time 30 --dump-header - --output - --write-out '\nHTTP_STATUS=%{http_code}\n' https://web-terminal-bvesa.sprites.app/
          capture diagnostics/apollo-sprite-lounge-state.txt curl --silent --show-error --max-time 30 --dump-header - --output - --write-out '\nHTTP_STATUS=%{http_code}\n' 'https://web-terminal-bvesa.sprites.app/api/watch/broadcast/state?roomId=system-spacemountainlive-lounge'
          # Read existing state only: no start, rotation, model call, or repair submission.
          capture diagnostics/rotator-ledgers.jsonl flyctl ssh console -a mtman-machine-rotator --command 'node --input-type=module -e "import fs from \"node:fs\";import {redactSensitiveText} from \"/app/dist/redaction.js\";console.log(JSON.stringify({managedApps:process.env.FLY_ROTATOR_APPS||process.env.MANAGED_FLY_APPS}));for(const name of [\"error-history.json\",\"observed-incidents.json\",\"error-baseline.json\",\"runtime-state.json\",\"hourly-repair-cycles.json\"]){try{const path=\"/data/\"+name;const size=fs.statSync(path).size;console.log(JSON.stringify({file:name,bytes:size}));if(size>25000000)throw new Error(\"ledger-too-large\");const data=JSON.parse(fs.readFileSync(path,\"utf8\"));const rows=Array.isArray(data)?data.slice(-50).map(r=>({recordedAt:r.recordedAt,appName:r.appName,status:r.status,message:String(r.message||r.summary||\"\").slice(0,700),classification:r.classification,startedAt:r.startedAt,finishedAt:r.finishedAt})):data;console.log(redactSensitiveText(JSON.stringify({file:name,total:Array.isArray(data)?data.length:undefined,data:rows})))}catch(e){console.log(JSON.stringify({file:name,readError:e.code||e.message}));process.exitCode=1}}" '
          cat diagnostics/*.result
          for app in mtman-machine-rotator apollo-station apollo-station-new streamweaver-new discord-stream-hub-new spmt-llm-worker; do
            for file in diagnostics/"$app"-*.txt; do
              [ -f "$file" ] || continue
              echo "FILE $file"
              tail -n 30 "$file"
            done
          done
          if grep -q FAILED diagnostics/*.result; then
            echo 'Diagnostic coverage is incomplete; inspect failed captures in the artifact.'
            exit 1
          fi
      - name: Preserve sanitized diagnostics even when a capture fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rotator-live-diagnostics
          path: diagnostics/
          retention-days: 1
          if-no-files-found: error

  recover-terminal:
    name: Recover SPMTFly saved credential without exporting secrets
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: spmt-fly-production-mutation
      cancel-in-progress: false
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - name: Restart original Sprite and restore saved authentication
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          python3 <<'PY'
          import base64,json,subprocess,sys
          source="(async()=>{\nconst fs=require('fs'),cp=require('child_process');\nconst apiToken=fs.readFileSync('/data/spmtfly-sprites-token','utf8').trim();\nconst base='https://api.sprites.dev/v1/sprites/';\nconst source='web-terminal',dest='spmt-ops-recovery';\nasync function api(name,path,method='GET',body){try{const r=await fetch(base+name+path,{method,headers:{Authorization:'Bearer '+apiToken},body,signal:AbortSignal.timeout(45000)});return {status:r.status,text:await r.text()};}catch{return {status:0,text:''}}}\nfor(const [name,id]of [[source,'sprite-2249fee2-ecf3-4b10-8bc1-314f4b9e5bcc'],[dest,'sprite-4bd76345-15a1-43ed-811f-9a3ee4618df8']]){\n const r=await api(name,'');if(r.status!==200||JSON.parse(r.text).id!==id)throw Error('sprite_identity_mismatch');\n}\nconst restarted=await api(source,'/restart','POST');console.log(JSON.stringify({phase:'original_sprite_restart',httpStatus:restarted.status}));if(![200,201,202,204].includes(restarted.status))throw Error('original_sprite_restart_failed');\nlet saved='',sourcePath='';\nfor(const path of ['/home/sprite/.fly/config.yml','/home/sprite/.fly/config.yaml','/home/sprite/.config/spmt/Fly token_update.txt']){\n const q=new URLSearchParams({path,workingDir:'/'});\n const r=await api(source,'/fs/read?'+q);console.log(JSON.stringify({phase:'saved_credential_read',path,httpStatus:r.status}));\n if(r.status!==200)continue;\n const text=r.text.trim(),m=text.match(/^\\s*access_token\\s*:\\s*(.+)\\s*$/m);\n let value=m?m[1].trim():text;try{value=JSON.parse(value)}catch{value=value.replace(/^['\"]|['\"]$/g,'')}\n if(typeof value==='string'&&value.length>30&&!/[\\r\\n]/.test(value)){saved=value;sourcePath=path;break;}\n}\nif(!saved)throw Error('saved_credential_unavailable');\nconst check=cp.spawnSync('flyctl',['machines','list','--app','mtman-machine-rotator','--json'],{encoding:'utf8',env:{...process.env,FLY_API_TOKEN:saved},timeout:45000});\nif(check.status!==0||!JSON.parse(check.stdout).some(m=>m.id==='2862e02c9263d8'))throw Error('recovered_fly_authentication_failed');\nconst q=new URLSearchParams({path:'/home/sprite/.fly/config.yml',workingDir:'/',mode:'0600',mkdirParents:'true'});\nconst write=await api(dest,'/fs/write?'+q,'PUT','access_token: '+JSON.stringify(saved)+'\\n');\nif(![200,201].includes(write.status))throw Error('replacement_credential_write_failed');\nconst wrapper=String.raw`#!/usr/bin/env node\nconst fs=require('fs'),cp=require('child_process');\nconst text=fs.readFileSync('/home/sprite/.fly/config.yml','utf8');\nconst match=text.match(/^\\s*access_token\\s*:\\s*(.+)\\s*$/m);\nif(!match)process.exit(1);\nlet value=match[1].trim();try{value=JSON.parse(value)}catch{value=value.replace(/^['\"]|['\"]$/g,'')}\nconst r=cp.spawnSync('/home/sprite/.fly/bin/flyctl',process.argv.slice(2),{stdio:'inherit',env:{...process.env,FLY_API_TOKEN:value}});\nprocess.exit(r.status??1);\n`;\nconst wq=new URLSearchParams({path:'/home/sprite/ops/bin/flyctl-spmt',workingDir:'/'});\nconst removed=await api(dest,'/fs/delete?'+wq,'DELETE');if(![200,204,404].includes(removed.status))throw Error('wrapper_link_removal_failed');\nwq.set('mode','0700');wq.set('mkdirParents','true');const wr=await api(dest,'/fs/write?'+wq,'PUT',wrapper);if(![200,201].includes(wr.status))throw Error('wrapper_install_failed');\nconst imported=cp.spawnSync('flyctl',['secrets','import','--stage','--app','mtman-machine-rotator'],{input:'FLY_API_TOKEN='+saved+'\\n',encoding:'utf8',timeout:90000,env:process.env});\nif(imported.status!==0)throw Error('fly_secret_staging_failed');\nconsole.log(JSON.stringify({ok:true,phase:'credential_recovered',sourcePath,destinationSprite:dest,configMode:'0600',flySecretStaged:true}));\n})().catch(e=>{const allowed=['sprite_identity_mismatch','original_sprite_restart_failed','saved_credential_unavailable','recovered_fly_authentication_failed','replacement_credential_write_failed','wrapper_link_removal_failed','wrapper_install_failed','fly_secret_staging_failed'];console.log(JSON.stringify({ok:false,error:allowed.includes(e.message)?e.message:'credential_recovery_failed'}));process.exitCode=1;});"
          command="node -e \"eval(Buffer.from('"+base64.b64encode(source.encode()).decode()+"','base64').toString('utf8'))\""
          r=subprocess.run(['flyctl','ssh','console','--app','mtman-machine-rotator','--machine','2862e02c9263d8','--command',command,'--quiet'],capture_output=True,text=True,timeout=360)
          ok=False
          for line in r.stdout.splitlines():
              if line.startswith('{'):
                  value=json.loads(line);print(json.dumps(value))
                  if value.get('ok') is True:ok=True
          if r.returncode or not ok:sys.exit('runtime_credential_recovery_failed')
          deployed=subprocess.run(['flyctl','secrets','deploy','--app','mtman-machine-rotator'],capture_output=True,text=True,timeout=180)
          print(json.dumps({'phase':'fly_secret_deployment','ok':deployed.returncode==0}))
          if deployed.returncode:sys.exit('fly_secret_deployment_failed')
          PY
