name: Recover targeted user data independently per machine

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-targeted-user-data.yml"

permissions:
  contents: read

concurrency:
  group: targeted-user-data-recovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Discover only already-started machines
        id: targets
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_MAIN || secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/discovery
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "Fly API token secret is missing; no recovery attempted." >&2
            exit 1
          fi
          timeout 30s flyctl apps list --json > /tmp/discovery/apps.json
          jq -e 'type=="array"' /tmp/discovery/apps.json >/dev/null
          : > /tmp/discovery/targets.jsonl
          while IFS= read -r app; do
            [ -n "$app" ] || continue
            safe_app="$(printf '%s' "$app" | tr -cd 'A-Za-z0-9._-')"
            machines="/tmp/discovery/machines-$safe_app.json"
            if ! timeout 25s flyctl machines list --app "$app" --json > "$machines"; then
              echo "Machine discovery failed for app=$safe_app; other apps will continue." >&2
              continue
            fi
            jq -c --arg app "$safe_app" '[.[] | select((.state // .State // "unknown") == "started") | {app:$app,machine:(.id // .ID),state:(.state // .State)} | select(.machine != null and .machine != "")]' "$machines" | jq -c '.[]' >> /tmp/discovery/targets.jsonl
          done < <(jq -r '.[] | (.Name // .name // .app_name // empty)' /tmp/discovery/apps.json)
          jq -sc '{include:.}' /tmp/discovery/targets.jsonl > /tmp/discovery/matrix.json
          cat /tmp/discovery/matrix.json
          echo "matrix=$(jq -c . /tmp/discovery/matrix.json)" >> "$GITHUB_OUTPUT"
      - name: Preserve discovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-discovery-${{ github.run_id }}
          path: /tmp/discovery/**
          retention-days: 90
          if-no-files-found: warn

  recover:
    needs: discover
    if: ${{ needs.discover.outputs.matrix != '' && needs.discover.outputs.matrix != '{"include":[]}' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Recover this machine with retries
        id: recovery
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_MAIN || secrets.FLY_API_TOKEN }}
          APP_NAME: ${{ matrix.app }}
          MACHINE_ID: ${{ matrix.machine }}
        run: |
          set -uo pipefail
          base=/tmp/machine-recovery
          mkdir -p "$base/archives" "$base/logs" "$base/raw"
          app="$APP_NAME"
          machine="$MACHINE_ID"
          echo "app=$app machine=$machine" | tee "$base/logs/target.txt"
          success=0
          reason=unknown
          for attempt in 1 2 3; do
            tag="attempt-$attempt"
            remote="/tmp/user-data-$machine.tar.gz"
            list="/tmp/user-data-$machine.files"
            status="/tmp/user-data-$machine.status"
            rlog="/tmp/user-data-$machine.log"
            local_archive="$base/raw/$tag.tar.gz"
            local_files="$base/raw/$tag.files.txt"
            local_err="$base/logs/$tag.err"
            echo "BEGIN app=$app machine=$machine attempt=$attempt" > "$base/logs/$tag.log"
            script='set -u
              list="'$list'"
              : > "$list"
              for root in /data /app/data /var/lib /home/node/.config; do
                [ -d "$root" ] || continue
                find "$root" -xdev -type d \( -iname "*cache*" -o -iname "*media*" -o -iname "*movie*" -o -iname "*music*" -o -iname "*thumbnail*" -o -iname "*node_modules*" \) -prune -o -type f \( -iname "*.db" -o -iname "*.sqlite" -o -iname "*.sqlite3" -o -iname "*.db3" -o -iname "*.bson" -o -iname "*.json" -o -iname "*.jsonl" -o -iname "*.ndjson" -o -iname "*.csv" -o -iname "*.yaml" -o -iname "*.yml" -o -iname "*.toml" -o -iname "*.xml" -o -iname "*.conf" -o -iname "*.ini" -o -iname "*.env.example" -o -iname "*.txt" \) -print >> "$list" 2>/dev/null || true
              done
              sort -u "$list" -o "$list"
              if [ ! -s "$list" ]; then echo no_candidate_files > "'$status'"; exit 22; fi
              tar -czf "'$remote'" -T "$list" 2>"'$rlog'"
              rc=$?
              echo "$rc" > "'$status'"
              exit "$rc"'
            encoded="$(printf '%s' "$script" | base64 -w0)"
            if ! timeout 35s flyctl ssh console --app "$app" --machine "$machine" --command "echo $encoded | base64 -d > /tmp/user-data-$machine.sh; chmod 700 /tmp/user-data-$machine.sh; rm -f $status $rlog; nohup sh /tmp/user-data-$machine.sh > /tmp/user-data-$machine.launch.log 2>&1 </dev/null & echo recovery_started" --quiet </dev/null > "$base/raw/$tag.launch.out" 2> "$local_err"; then
              reason=remote_archive_launch_failed
              echo "stage=launch error=$(head -c 800 "$local_err" | tr '\n' ' ')" >> "$base/logs/$tag.log"
            else
              remote_status=""
              for poll in $(seq 1 30); do
                remote_status="$(timeout 20s flyctl ssh console --app "$app" --machine "$machine" --command "sh -c 'cat $status 2>/dev/null || echo pending'" --quiet </dev/null 2>>"$local_err" | tail -n 1 | tr -cd 'A-Za-z0-9_-')"
                [ "$remote_status" != "pending" ] && [ "$remote_status" != "missing" ] && [ -n "$remote_status" ] && break
                sleep 5
              done
              if [ "$remote_status" != "0" ]; then
                reason="remote_archive_exit_${remote_status:-timeout}"
                diag="$(timeout 20s flyctl ssh console --app "$app" --machine "$machine" --command "sh -c 'tail -c 1000 $rlog 2>/dev/null || true'" --quiet </dev/null 2>>"$local_err" | tr '\n' ' ' || true)"
                echo "stage=archive status=$remote_status diagnostic=$diag" >> "$base/logs/$tag.log"
              elif ! timeout 600s flyctl ssh sftp get "$remote" "$local_archive" --app "$app" --machine "$machine" --quiet </dev/null > "$base/raw/$tag.sftp.out" 2> "$local_err"; then
                reason=download_failed
                echo "stage=download error=$(head -c 800 "$local_err" | tr '\n' ' ')" >> "$base/logs/$tag.log"
              elif ! tar -tzf "$local_archive" > "$local_files" 2> "$base/logs/$tag.integrity.err"; then
                reason=archive_integrity_check_failed
                echo "stage=integrity error=$(head -c 800 "$base/logs/$tag.integrity.err" | tr '\n' ' ')" >> "$base/logs/$tag.log"
              else
                archive="$base/archives/$app-$machine.tar.gz"
                mv "$local_archive" "$archive"
                sha="$(sha256sum "$archive" | awk '{print $1}')"
                bytes="$(stat -c '%s' "$archive")"
                files="$(wc -l < "$local_files" | tr -d ' ')"
                jq -nc --arg app "$app" --arg machine "$machine" --arg file "$(basename "$archive")" --arg sha256 "$sha" --argjson bytes "$bytes" --argjson files "$files" --argjson attempts "$attempt" '{app:$app,machine:$machine,file:$file,sha256:$sha256,archive_bytes:$bytes,file_count:$files,attempts:$attempts,status:"archive_created_integrity_checked"}' > "$base/report.json"
                echo "SUCCESS files=$files archive_bytes=$bytes sha256=$sha encryption=not_used_private_artifact" >> "$base/logs/$tag.log"
                success=1
                timeout 20s flyctl ssh console --app "$app" --machine "$machine" --command "rm -f $remote $list $status $rlog /tmp/user-data-$machine.sh" --quiet </dev/null >/dev/null 2>&1 || true
                break
              fi
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "RETRY next_attempt=$((attempt+1)) reason=$reason" | tee -a "$base/logs/$tag.log"
              sleep 3
            fi
          done
          if [ "$success" -eq 0 ]; then
            jq -nc --arg app "$app" --arg machine "$machine" --arg reason "$reason" '{app:$app,machine:$machine,status:"failed_after_retries",failure_reason:$reason,attempts:3}' > "$base/report.json"
            exit 1
          fi
      - name: Save this machine's archive immediately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovered-${{ matrix.app }}-${{ matrix.machine }}-${{ github.run_id }}
          path: |
            /tmp/machine-recovery/archives/**
            /tmp/machine-recovery/report.json
            /tmp/machine-recovery/logs/**
            /tmp/machine-recovery/raw/*.err
          retention-days: 90
          if-no-files-found: warn
