name: Extract Discord Stream Hub database safely

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-discord-stream-hub-data.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extract-discord-stream-hub-data
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Back up and extract Discord Stream Hub data
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_MAIN || secrets.FLY_API_TOKEN }}
        run: |
          set -uo pipefail
          app=discord-stream-hub-new
          machine=d895de5b227d28
          mkdir -p recovered/discord-stream-hub logs
          if [ -z "${FLY_API_TOKEN:-}" ]; then echo "::error::Fly API token secret missing"; exit 1; fi
          # Create a consistent SQLite backup on the running machine when possible.
          remote_script='set -u
          if command -v sqlite3 >/dev/null 2>&1; then
            sqlite3 /data/app.db ".backup /tmp/app-recovery.db" && echo SQLITE_BACKUP_OK
          elif command -v python3 >/dev/null 2>&1; then
            python3 -c "import sqlite3; s=sqlite3.connect(\"file:/data/app.db?mode=ro\",uri=True); d=sqlite3.connect(\"/tmp/app-recovery.db\"); s.backup(d); d.close(); s.close(); print(\"SQLITE_BACKUP_OK\")"
          else
            echo SQLITE_BACKUP_TOOL_MISSING
            exit 31
          fi
          find /data -maxdepth 3 -type f -size -100M \( -iname "*.json" -o -iname "*.db" -o -iname "*.sqlite" -o -iname "*.sqlite3" -o -iname "*.wal" -o -iname "*.shm" \) -print > /tmp/dsh-recovery-files.txt
          printf "/tmp/app-recovery.db\n" >> /tmp/dsh-recovery-files.txt
          sort -u /tmp/dsh-recovery-files.txt -o /tmp/dsh-recovery-files.txt
          '
          encoded="$(printf '%s' "$remote_script" | base64 -w0)"
          if ! timeout 60s flyctl ssh console --app "$app" --machine "$machine" --command "sh -c 'echo $encoded | base64 -d > /tmp/dsh-recovery.sh; sh /tmp/dsh-recovery.sh'" --quiet </dev/null > logs/remote-backup.out 2> logs/remote-backup.err; then
            echo "Remote SQLite backup command failed; will still attempt to extract database files and WAL." >> logs/remote-backup.err
          fi
          # The direct database and WAL are still downloaded even if a SQLite backup tool is absent.
          for remote in /tmp/app-recovery.db /tmp/dsh-recovery-files.txt /data/app.db /data/app.db-wal /data/app.db-shm; do
            dest="recovered/discord-stream-hub/${remote#/}"
            mkdir -p "$(dirname "$dest")"
            if timeout 180s flyctl ssh sftp get "$remote" "$dest" --app "$app" --machine "$machine" --quiet </dev/null > "logs/$(basename "$remote").out" 2> "logs/$(basename "$remote").err"; then
              [ -s "$dest" ] && sha256sum "$dest" >> recovered/discord-stream-hub/SHA256SUMS
            else
              echo "$remote" >> recovered/discord-stream-hub/missing-or-failed.txt
            fi
          done
          if [ -s recovered/discord-stream-hub/tmp/app-recovery.db ]; then
            if command -v sqlite3 >/dev/null 2>&1; then sqlite3 recovered/discord-stream-hub/tmp/app-recovery.db 'PRAGMA integrity_check;' > recovered/discord-stream-hub/sqlite-integrity.txt 2>&1 || true; fi
          fi
          {
            echo "app=$app"
            echo "machine=$machine"
            echo "backup_method=$(grep -o 'SQLITE_BACKUP_OK\|SQLITE_BACKUP_TOOL_MISSING' logs/remote-backup.out | tail -1 || true)"
            echo "downloaded_files=$(find recovered/discord-stream-hub -type f | wc -l)"
            echo "captured_at=$(date -u +%FT%TZ)"
          } > recovered/discord-stream-hub/RECOVERY-REPORT.txt
          cat recovered/discord-stream-hub/RECOVERY-REPORT.txt
          [ -s recovered/discord-stream-hub/data/app.db ] || [ -s recovered/discord-stream-hub/tmp/app-recovery.db ]
      - name: Upload Discord Stream Hub data immediately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discord-stream-hub-data-${{ github.run_id }}
          path: |
            recovered/discord-stream-hub/**
            logs/**
          retention-days: 90
          if-no-files-found: warn
