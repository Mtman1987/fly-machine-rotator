name: Athena private validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/athenaOsChatProxy.ts'
      - 'src/dshMtFixitGateway.ts'
      - 'src/flyLlmProvisioner.ts'
      - 'test/**'
      - '.github/workflows/athena-private-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
