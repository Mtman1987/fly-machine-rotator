name: Athena private validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/athenaOsChatProxy.ts'
      - 'src/dshMtFixitGateway.ts'
      - 'src/flyLlmProvisioner.ts'
      - 'test/athenaOsChatProxy.test.ts'
      - 'test/dshMtFixitGateway.test.ts'
      - 'test/mcpControlServer.test.ts'
      - '.github/workflows/athena-private-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Athena gateway tests
        run: >-
          npx vitest run
          test/athenaOsChatProxy.test.ts
          test/dshMtFixitGateway.test.ts
          test/mcpControlServer.test.ts
