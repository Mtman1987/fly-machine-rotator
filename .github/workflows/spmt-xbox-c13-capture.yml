name: SPMT Xbox c13 live capture

on:
  push:
    branches:
      - ops/spmt-xbox-c13-capture
    paths:
      - ".github/workflows/spmt-xbox-c13-capture.yml"

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ops/spmt-xbox-c13-capture
          fetch-depth: 0
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - name: Capture current Xbox state and fatal signatures
        run: |
          set -euo pipefail
          mkdir -p /tmp/spmt-xbox-c13
          date -u +%Y-%m-%dT%H:%M:%SZ
          flyctl machine list -a spmt-live --json --access-token "$FLY_API_TOKEN" > /tmp/spmt-xbox-c13/machines.json
          flyctl logs -a spmt-live --json --no-tail --access-token "$FLY_API_TOKEN" > /tmp/spmt-xbox-c13/logs.jsonl || true
          echo "--- active xbox machines ---"
          jq '[.[] | select((.config.env.FLY_PROCESS_GROUP // .config.metadata.fly_process_group // "") == "xbox" and .state == "started") | {id,name,state,host_status,updated_at,image_ref,events}]' /tmp/spmt-xbox-c13/machines.json
          echo "--- xbox worker startup lines ---"
          grep -F 'XboxWorker' /tmp/spmt-xbox-c13/logs.jsonl | tail -n 20 || true
          echo "--- crash signatures ---"
          grep -Ei 'Runtime\.evaluate timed out|unhandledrejection|unhandled rejection|uncaught|exit(ed)? .*code 1|code 1|CDP connection error' /tmp/spmt-xbox-c13/logs.jsonl || true
      - name: Upload capture
        uses: actions/upload-artifact@v4
        with:
          name: spmt-xbox-c13-capture
          path: /tmp/spmt-xbox-c13/
          retention-days: 1
      - name: Remove one-shot workflow
        run: |
          rm .github/workflows/spmt-xbox-c13-capture.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/spmt-xbox-c13-capture.yml
          git commit -m "Remove temporary SPMT Xbox c13 capture"
          git push origin HEAD:ops/spmt-xbox-c13-capture
