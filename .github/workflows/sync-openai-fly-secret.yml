name: Sync OpenAI Fly Secret

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-openai-fly-secret.yml

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      GH_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Check Fly access
        run: |
          test -n "$FLY_API_TOKEN" || { echo "FLY_API_TOKEN is not configured"; exit 1; }
          flyctl status --app mtman-machine-rotator >/dev/null

      - name: Sync OPENAI_API_KEY without exposing it
        shell: bash
        run: |
          set -euo pipefail

          # Prefer the Rotator's existing runtime secret. This keeps the value
          # entirely inside Fly and never moves it through GitHub logs/source.
          if flyctl ssh console --app mtman-machine-rotator --command 'sh -lc '\''test -n "$OPENAI_API_KEY"'\'' >/dev/null 2>&1; then
            echo "Using existing Rotator OPENAI_API_KEY as the source."
            flyctl ssh console --app mtman-machine-rotator --command 'sh -lc '\''printf "OPENAI_API_KEY=%s\n" "$OPENAI_API_KEY" | flyctl secrets import --app streamweaver-new >/dev/null'\''
          elif [ -n "${GH_OPENAI_API_KEY:-}" ]; then
            echo "Rotator does not currently expose OPENAI_API_KEY; using the GitHub Actions secret."
            printf 'OPENAI_API_KEY=%s\n' "$GH_OPENAI_API_KEY" | flyctl secrets import --app mtman-machine-rotator >/dev/null
            printf 'OPENAI_API_KEY=%s\n' "$GH_OPENAI_API_KEY" | flyctl secrets import --app streamweaver-new >/dev/null
          else
            echo "OPENAI_API_KEY is not present on the Rotator and no GitHub OPENAI_API_KEY secret is configured."
            exit 2
          fi

      - name: Verify secret names only
        shell: bash
        run: |
          set -euo pipefail
          for app in mtman-machine-rotator streamweaver-new; do
            echo "Checking $app"
            flyctl secrets list --app "$app" | grep -q 'OPENAI_API_KEY' || {
              echo "OPENAI_API_KEY is missing from $app"
              exit 1
            }
            echo "OPENAI_API_KEY is present on $app"
          done
