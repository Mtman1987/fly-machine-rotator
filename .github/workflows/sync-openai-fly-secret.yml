name: Sync OpenAI Fly Secret

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-openai-fly-secret.yml

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      GH_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Check Fly access
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FLY_API_TOKEN:-}" || { echo "FLY_API_TOKEN is not configured"; exit 1; }
          flyctl status --app mtman-machine-rotator >/dev/null

      - name: Find a working OpenAI credential already on Fly
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_app=""

          # First prefer a GitHub Actions copy if one exists. Otherwise reuse a
          # valid credential already deployed to any Fly app in this org.
          if [ -n "${GH_OPENAI_API_KEY:-}" ]; then
            echo "source=github" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t apps < <(flyctl apps list --json | jq -r '.[] | (.Name // .name // empty)' | sort -u)
          for app in "${apps[@]}"; do
            [ -n "$app" ] || continue
            if ! flyctl secrets list --app "$app" 2>/dev/null | grep -q '^OPENAI_API_KEY\b'; then
              continue
            fi

            # Validate the app's own key without printing it. Node 18+ apps can
            # test directly; failures simply move on to the next app.
            probe="$(flyctl ssh console --app "$app" --command 'node -e '\''const k=process.env.OPENAI_API_KEY;if(!k)process.exit(2);fetch("https://api.openai.com/v1/models",{headers:{Authorization:"Bearer "+k}}).then(r=>{console.log(r.ok?"OPENAI_OK":"OPENAI_BAD_"+r.status);process.exit(r.ok?0:3)}).catch(()=>process.exit(4))'\'' 2>/dev/null || true)"
            if printf '%s' "$probe" | grep -q 'OPENAI_OK'; then
              source_app="$app"
              break
            fi
          done

          if [ -z "$source_app" ]; then
            echo "No Fly app currently has a working OPENAI_API_KEY, and GitHub has no OPENAI_API_KEY secret."
            exit 2
          fi

          echo "Found a working OpenAI credential on an existing Fly app."
          echo "source=fly" >> "$GITHUB_OUTPUT"
          echo "source_app=$source_app" >> "$GITHUB_OUTPUT"

      - name: Import OPENAI_API_KEY into Rotator and StreamWeaver
        shell: bash
        env:
          SOURCE: ${{ steps.source.outputs.source }}
          SOURCE_APP: ${{ steps.source.outputs.source_app }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/openai.key"
          payload_file="$RUNNER_TEMP/openai.env"
          trap 'rm -f "$key_file" "$payload_file"' EXIT

          if [ "$SOURCE" = "github" ]; then
            printf '%s' "$GH_OPENAI_API_KEY" > "$key_file"
          else
            # Read only the environment value from the already-running source
            # app. Nothing is echoed into the Actions log.
            flyctl ssh console --app "$SOURCE_APP" --command 'node -e '\''process.stdout.write(process.env.OPENAI_API_KEY||"")'\'' > "$key_file" 2>/dev/null
          fi

          key="$(tr -d '\r\n' < "$key_file")"
          case "$key" in
            sk-*) ;;
            *) echo "The discovered OpenAI credential did not have the expected key shape."; exit 3 ;;
          esac
          [ "${#key}" -ge 20 ] || { echo "The discovered OpenAI credential was unexpectedly short."; exit 3; }
          echo "::add-mask::$key"

          printf 'OPENAI_API_KEY=%s\n' "$key" > "$payload_file"
          for app in mtman-machine-rotator streamweaver-new; do
            cat "$payload_file" | flyctl secrets import --app "$app" >/dev/null
            echo "Updated OPENAI_API_KEY on $app"
          done

      - name: Verify secret names only
        shell: bash
        run: |
          set -euo pipefail
          for app in mtman-machine-rotator streamweaver-new; do
            flyctl secrets list --app "$app" | grep -q '^OPENAI_API_KEY\b' || {
              echo "OPENAI_API_KEY is missing from $app"
              exit 1
            }
            echo "OPENAI_API_KEY is present on $app"
          done
