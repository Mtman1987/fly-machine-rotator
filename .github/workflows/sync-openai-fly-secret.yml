name: Sync OpenAI Fly Secret

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-openai-fly-secret.yml

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      GH_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Check required secret sources
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FLY_API_TOKEN:-}" || { echo "FLY_API_TOKEN is not configured"; exit 1; }
          test -n "${GH_OPENAI_API_KEY:-}" || {
            echo "OPENAI_API_KEY is not configured as a GitHub Actions secret."
            echo "Add it once to this repository, then rerun this workflow."
            exit 2
          }
          flyctl status --app mtman-machine-rotator >/dev/null
          flyctl status --app streamweaver-new >/dev/null

      - name: Import OPENAI_API_KEY into Fly apps
        shell: bash
        run: |
          set -euo pipefail
          for app in mtman-machine-rotator streamweaver-new; do
            printf 'OPENAI_API_KEY=%s\n' "$GH_OPENAI_API_KEY" | flyctl secrets import --app "$app" >/dev/null
            echo "Updated OPENAI_API_KEY on $app"
          done

      - name: Verify secret names only
        shell: bash
        run: |
          set -euo pipefail
          for app in mtman-machine-rotator streamweaver-new; do
            flyctl secrets list --app "$app" | grep -q 'OPENAI_API_KEY' || {
              echo "OPENAI_API_KEY is missing from $app"
              exit 1
            }
            echo "OPENAI_API_KEY is present on $app"
          done
