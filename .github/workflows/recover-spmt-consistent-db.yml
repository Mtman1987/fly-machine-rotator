name: Consistent SPMT SQLite recovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-spmt-consistent-db.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-db:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Create SQLite online backup and encrypt the export
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_MAIN || secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FLY_API_TOKEN:-}" ]; then echo "No Fly API token configured"; exit 1; fi
          printf '%s\n' '-----BEGIN PUBLIC KEY-----' '' '-----END PUBLIC KEY-----' > /tmp/export-public.pem
          timeout 600s flyctl ssh console --app spmt-live --machine 8d0274ce21e918 -C "sh -c 'node -e \"\$(echo Y29uc3QgRGF0YWJhc2U9cmVxdWlyZSgiYmV0dGVyLXNxbGl0ZTMiKTtjb25zdCBkYj1uZXcgRGF0YWJhc2UoIi9kYXRhL3NwbXQuZGIiLHtyZWFkb25seTp0cnVlLGZpbGVNdXN0RXhpc3Q6dHJ1ZX0pO2RiLmJhY2t1cCgiL3RtcC9zcG10LmRiLmJhY2t1cCIpLnRoZW4oKCk9PntkYi5jbG9zZSgpO30pLmNhdGNoKGU9Pntjb25zb2xlLmVycm9yKGUpO3Byb2Nlc3MuZXhpdCgxKX0pOw== | base64 -d)\" && tar --exclude=./spmt.db --exclude=./spmt.db-wal --exclude=./spmt.db-shm -cf - -C /data . -C /tmp spmt.db.backup | gzip -1 | base64'" > /tmp/data.b64
          base64 -d /tmp/data.b64 > /tmp/spmt-consistent-data.tar.gz
          tar -tzf /tmp/spmt-consistent-data.tar.gz > /tmp/spmt-consistent-file-list.txt
          echo "Archive entries: $(wc -l < /tmp/spmt-consistent-file-list.txt); bytes: $(wc -c < /tmp/spmt-consistent-data.tar.gz)"
          openssl rand -hex 32 > /tmp/recovery-password
          openssl enc -aes-256-cbc -salt -pbkdf2 -in /tmp/spmt-consistent-data.tar.gz -out /tmp/spmt-consistent-data.tar.gz.enc -pass file:/tmp/recovery-password
          openssl pkeyutl -encrypt -pubin -inkey /tmp/export-public.pem -in /tmp/recovery-password -out /tmp/spmt-consistent-data.key.enc
          rm -f /tmp/data.b64 /tmp/spmt-consistent-data.tar.gz /tmp/recovery-password
      - name: Upload encrypted consistent SPMT backup
        uses: actions/upload-artifact@v4
        with:
          name: recovery-spmt-consistent-encrypted
          path: |
            /tmp/spmt-consistent-data.tar.gz.enc
            /tmp/spmt-consistent-data.key.enc
            /tmp/spmt-consistent-file-list.txt
          retention-days: 1
          if-no-files-found: error
