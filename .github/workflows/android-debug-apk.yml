name: Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/android-debug-apk.yml"
      - "mobile/**"
      - "scripts/patch-ecosystem-workspace-parity.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-debug-apk.yml"
      - "mobile/**"
      - "scripts/patch-ecosystem-workspace-parity.mjs"

permissions:
  contents: write

jobs:
  debug:
    name: Build MountainView Android debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Apply current SPMT workspace parity
        run: cd .. && node scripts/patch-ecosystem-workspace-parity.mjs
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
        env:
          MOUNTAINVIEW_ENABLE_META_DAT: "false"
      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: mobile/android
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mountainview-ai-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

  release:
    name: Build MountainView Android release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Apply current SPMT workspace parity
        run: cd .. && node scripts/patch-ecosystem-workspace-parity.mjs
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
        env:
          MOUNTAINVIEW_ENABLE_META_DAT: "false"
      - name: Build release APK
        run: ./gradlew assembleRelease
        working-directory: mobile/android
      - name: Stage public APK name
        run: cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/MountainView-Android.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mountainview-ai-release-apk
          path: mobile/android/app/build/outputs/apk/release/MountainView-Android.apk
      - name: Publish latest APK release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mountainview-latest
          name: MountainView AI Latest Android APK
          body: Latest installable MountainView AI Android APK for testing. Includes the current SPMT workspace integration.
          prerelease: true
          files: mobile/android/app/build/outputs/apk/release/MountainView-Android.apk
