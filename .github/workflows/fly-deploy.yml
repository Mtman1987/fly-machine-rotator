      - name: Deploy rotator
        run: flyctl deploy --remote-only --config fly.toml --build-arg BUILD_SHA=${{ github.sha }} --build-arg GITHUB_SHA=${{ github.sha }} --build-arg GH_SHA=${{ github.sha }}

      - name: Verify live Rotator health and protected report route
        shell: bash
        run: |
          set -euo pipefail
          base="https://mtman-machine-rotator.fly.dev"
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "$base/healthz"
          status="$(curl --silent --show-error --output /tmp/rotator-report-gate.json --write-out '%{http_code}' "$base/logs/discord-report/run-readout.json")"
          if [ "$status" != "403" ]; then
            echo "Expected unauthenticated report request to be denied with 403; got $status"
            cat /tmp/rotator-report-gate.json
            exit 1
          fi
          grep -q "SPMT admin session" /tmp/rotator-report-gate.json
          echo "Live health is good and report evidence remains protected."

      - name: Verify persisted report files on the Rotator volume
        shell: bash
        run: |
          set -euo pipefail
          flyctl ssh console -a mtman-machine-rotator --command 'node --input-type=module -e "import fs from \"node:fs\"; const root=\"/data/operations-evidence/discord-report\"; for (const name of [\"latest.json\",\"rotator-run-readout.json\",\"rotator-log-snapshot.json\"]) { const path=root+\"/\"+name; const raw=fs.readFileSync(path,\"utf8\"); JSON.parse(raw); console.log(JSON.stringify({file:name,bytes:Buffer.byteLength(raw)})); }"'