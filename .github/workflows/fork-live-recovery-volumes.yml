name: Fork live recovery volumes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fork-live-recovery-volumes.yml"
  workflow_dispatch:
    inputs:
      volume_jobs:
        description: "One per line: app|source_volume_id. Originals are not changed."
        required: true
        default: "chat-tag-new|vol_vly90ledzql60op4
streamweaver-new|vol_4ojp7z8jy1mwjoxr
discord-stream-hub-new|vol_vz8ey6wpj0nl7zqv"
        type: string

permissions:
  contents: read

concurrency:
  group: fork-live-recovery-volumes
  cancel-in-progress: false

jobs:
  fork:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Fork each source volume without touching originals
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_MAIN || secrets.FLY_API_TOKEN }}
          VOLUME_JOBS: ${{ inputs.volume_jobs }}
        run: |
          set -uo pipefail
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "::error::Missing FLY_API_TOKEN_MAIN / FLY_API_TOKEN secret."
            exit 1
          fi
          if [ -z "${VOLUME_JOBS:-}" ]; then
            VOLUME_JOBS=$'chat-tag-new|vol_vly90ledzql60op4\nstreamweaver-new|vol_4ojp7z8jy1mwjoxr\ndiscord-stream-hub-new|vol_vz8ey6wpj0nl7zqv'
          fi
          mkdir -p results
          printf 'app\tsource_volume\tresult\tdetail\n' > results/fork-results.tsv
          failures=0
          while IFS='|' read -r app source; do
            app="$(printf '%s' "${app:-}" | tr -d '[:space:]')"
            source="$(printf '%s' "${source:-}" | tr -d '[:space:]')"
            [ -n "$app" ] || continue
            case "$app" in *[!A-Za-z0-9_-]*)
              printf '%s\t%s\tFAILED\tinvalid_app_name\n' "$app" "$source" >> results/fork-results.tsv
              failures=$((failures+1)); continue ;;
            esac
            case "$source" in vol_*) ;; *)
              printf '%s\t%s\tFAILED\tinvalid_volume_id\n' "$app" "$source" >> results/fork-results.tsv
              failures=$((failures+1)); continue ;;
            esac
            echo "::group::Forking $source in $app"
            set +e
            output="$(timeout 240s flyctl volumes fork "$source" -a "$app" --name recovery_copy --yes 2>&1)"
            rc=$?
            set -e
            printf '%s\n' "$output"
            if [ "$rc" -eq 0 ]; then
              printf '%s\t%s\tCREATED\t%s\n' "$app" "$source" "$(printf '%s' "$output" | tr '\t\n' '  ' | cut -c1-700)" >> results/fork-results.tsv
            else
              printf '%s\t%s\tFAILED_exit_%s\t%s\n' "$app" "$source" "$rc" "$(printf '%s' "$output" | tr '\t\n' '  ' | cut -c1-700)" >> results/fork-results.tsv
              failures=$((failures+1))
            fi
            echo "::endgroup::"
          done <<< "$VOLUME_JOBS"
          cat results/fork-results.tsv
          echo "failures=$failures" >> "$GITHUB_OUTPUT"
          [ "$failures" -eq 0 ]

      - name: Save fork results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fly-live-volume-forks-${{ github.run_id }}
          path: results/fork-results.tsv
          retention-days: 90
          if-no-files-found: error
