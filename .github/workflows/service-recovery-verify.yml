name: Verify StreamWeaver and Chat Tag recovery
on:
  push:
    branches: [main]
    paths: [.github/workflows/service-recovery-verify.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - name: Numeric resource sample
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          python3 <<'PY'
          import json,base64,subprocess
          source="\n(async()=>{\nconst fs=require('fs');\nconst safe=p=>{try{return fs.readFileSync(p,'utf8')}catch{return ''}};\nconst rows=()=>fs.readdirSync('/proc').filter(p=>/^\\d+$/.test(p)).map(p=>{\nconst comm=safe('/proc/'+p+'/comm').trim();\nconst category=/^node$/.test(comm)?'node':/^python/.test(comm)?'python':/^ffmpeg$/.test(comm)?'ffmpeg':'other';\nconst stat=safe('/proc/'+p+'/stat');const fields=stat.slice(stat.lastIndexOf(')')+2).split(/\\s+/);\nconst status=safe('/proc/'+p+'/status');\nreturn {pid:p,category,ticks:Number(fields[11]||0)+Number(fields[12]||0),rssKb:Number(status.match(/VmRSS:\\s+(\\d+)/)?.[1]||0),threads:Number(status.match(/Threads:\\s+(\\d+)/)?.[1]||0)};\n});\nconst cpu=()=>safe('/proc/stat').split('\\n')[0].trim().split(/\\s+/).slice(1).map(Number);const cpuBefore=cpu();const first=rows();await new Promise(r=>setTimeout(r,2000));const second=rows();const cpuAfter=cpu();const delta=cpuAfter.map((n,i)=>n-cpuBefore[i]);const total=delta.slice(0,8).reduce((a,b)=>a+b,0);const cpuStealPercent=total?Math.round(1000*delta[7]/total)/10:0;\nconst summary={};for(const row of second){if(row.category==='other')continue;const prev=first.find(x=>x.pid===row.pid);const s=summary[row.category]||{processes:0,rssMb:0,threads:0,cpuSeconds:0};s.processes++;s.rssMb+=Math.round(row.rssKb/1024);s.threads+=row.threads;s.cpuSeconds+=Math.max(0,row.ticks-(prev?.ticks??row.ticks))/100;summary[row.category]=s;}\nconst mem=safe('/proc/meminfo');const avail=Number(mem.match(/MemAvailable:\\s+(\\d+)/)?.[1]||0);\nconsole.log(JSON.stringify({sampleSeconds:2,cpuStealPercent,ramAvailableMb:Math.round(avail/1024),processCategories:summary}));\n})().catch(()=>{console.error('resource_sample_failed');process.exit(1)});\n"
          encoded=base64.b64encode(source.encode()).decode()
          command="node -e \"eval(Buffer.from('"+encoded+"','base64').toString('utf8'))\""
          for app in ['streamweaver-new','chat-tag-new','chat-tag-bot-new']:
              r=subprocess.run(['flyctl','ssh','console','--app',app,'--command',command,'--quiet'],capture_output=True,text=True,timeout=60)
              for line in r.stdout.splitlines():
                  if line.startswith('{'):print(json.dumps({'app':app,'sample':json.loads(line)}))
              if r.returncode:raise SystemExit('resource_sample_failed')
          PY
      - name: Verify actual HTTP status and active release
        run: |
          python3 <<'PY'
          import json,time,urllib.request,concurrent.futures
          urls=['https://streamweaver-new.fly.dev/api/health','https://streamweaver-new.fly.dev/api/shared-chat/featured?tenant=spacemountainlive&fallback=latest','https://chat-tag-new.fly.dev/api/health','https://chat-tag-new.fly.dev/api/tag','https://chat-tag-bot-new.fly.dev/health']
          def probe(i):
              t=time.monotonic()
              try:
                  with urllib.request.urlopen(urls[i],timeout=10) as r:
                      raw=r.read(); status=r.status
                  body=json.loads(raw)
                  result={'target':i,'status':status,'elapsedMs':round((time.monotonic()-t)*1000)}
                  if i in [0,2]:result['buildSha']=body.get('buildSha')
                  if i==4:result['connected']=body.get('connected')
                  return result
              except Exception:return {'target':i,'status':0,'elapsedMs':round((time.monotonic()-t)*1000)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:
              results=list(pool.map(probe,range(5)))
          for r in results:print(json.dumps(r))
          assert all(r['status']==200 for r in results), 'service_verification_failed'
          PY

      - name: Wait for the exact repaired release
        run: |
          python3 <<'PY'
          import urllib.request,json,time
          expected='ec4550fbacf2c6e801ebebd05d0cfc45c0736294'
          for attempt in range(24):
              try:
                  with urllib.request.urlopen('https://streamweaver-new.fly.dev/api/health',timeout=10) as r:
                      body=json.loads(r.read())
                      if r.status==200 and body.get('buildSha')==expected:
                          print('repaired_release_verified')
                          break
              except Exception: pass
              time.sleep(10)
          else:raise SystemExit('repaired_release_not_active')
          PY
      - name: Verify authenticated command handling from the bot host
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          python3 <<'PY'
          import base64,subprocess
          source="""(async()=>{const t=Date.now();const r=await fetch((process.env.API_BASE||'https://chat-tag-new.fly.dev')+'/api/game-hub/command',{method:'POST',headers:{'content-type':'application/json','x-bot-secret':process.env.BOT_SECRET_KEY||''},body:JSON.stringify({channel:'spacemountainlive',username:'mtman1987',displayName:'mtman1987',message:'spmt quackdex',source:'owner-recovery-verification'}),signal:AbortSignal.timeout(10000)});const b=await r.json();console.log(JSON.stringify({status:r.status,elapsedMs:Date.now()-t,handled:b.handled===true,replyPresent:typeof b.reply==='string'&&b.reply.length>0}));if(!r.ok||b.handled!==true||!b.reply)process.exit(2);})().catch(()=>{console.error('command_verification_failed');process.exit(1)});"""
          encoded=base64.b64encode(source.encode()).decode()
          command="node -e \"eval(Buffer.from('"+encoded+"','base64').toString('utf8'))\""
          r=subprocess.run(['flyctl','ssh','console','--app','chat-tag-bot-new','--machine','48ee03ea331e08','--command',command,'--quiet'],capture_output=True,text=True,timeout=60)
          for line in r.stdout.splitlines():
              if line.startswith('{'): print(line)
          if r.returncode:raise SystemExit('command_verification_failed')
          PY
      - uses: actions/checkout@v4
      - name: Count recent failure categories without exporting logs
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { parseJsonLines } from './scripts/github-control-direct.mjs';
          const since=Date.now()-120000;
          for(const app of ['streamweaver-new','chat-tag-new','chat-tag-bot-new']){
            const raw=execFileSync('flyctl',['logs','--app',app,'--json','--no-tail'],{encoding:'utf8',timeout:60000,maxBuffer:4*1024*1024});
            const entries=parseJsonLines(raw).filter(e=>Date.parse(e.timestamp||e.time||e.ts||'')>=since);
            const counts={jsonErrors:0,apiTimeouts:0,healthFailures:0,uncaughtExceptions:0};
            for(const e of entries){
              const message=String(e.message||e.msg||e.log||'');
              if(/SyntaxError.*JSON|Unexpected.*JSON/.test(message))counts.jsonErrors++;
              if(/API Error.*timeout/.test(message))counts.apiTimeouts++;
              if(/Health check.*has failed/.test(message))counts.healthFailures++;
              if(/uncaughtException/.test(message))counts.uncaughtExceptions++;
            }
            console.log(JSON.stringify({app,recentRecordCount:entries.length,sampleWindowSeconds:120,counts}));
          }
          NODE

      - name: Verify Stella executes a viewer request on the live Lounge
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          python3 <<'PY'
          import base64,subprocess
          source="(async()=>{process.chdir('/app');const req=require('module').createRequire('/app/package.json');req('tsx/cjs/api').register({tsconfig:'/app/tsconfig.json'});const {routeBotAction}=req('./src/services/bot-action-runtime.ts');const {getLoungeAudioMix}=req('./src/services/lounge-audio-mix.ts');const before=await getLoungeAudioMix();const output=before.selected;const value=before.levels[output];const message='Stella set '+output+' volume to '+value+' percent';const actor={username:'owner-recovery-viewer-probe',role:'member'};const result=await routeBotAction(message,{tenantId:'spacemountainlive',sourceTenantId:'spacemountainlive',sourceActorRole:'member',executorAuthority:'stella-lounge-moderator',source:'twitch',botName:'Stella',message,actor});const after=await getLoungeAudioMix();const unchanged=JSON.stringify(before.levels)===JSON.stringify(after.levels)&&before.selected===after.selected;console.log(JSON.stringify({action:result?.action,status:result?.status,requesterRole:actor.role,mixerLevelsUnchanged:unchanged}));if(result?.action!=='sw.lounge.volume'||result.status!=='completed'||!unchanged||actor.role!=='member')process.exit(2);})().catch(()=>{console.error('stella_live_action_verification_failed');process.exit(1)});"
          encoded=base64.b64encode(source.encode()).decode()
          command="node -e \"eval(Buffer.from('"+encoded+"','base64').toString('utf8'))\""
          r=subprocess.run(['flyctl','ssh','console','--app','streamweaver-new','--machine','080e967ea95558','--command',command,'--quiet'],capture_output=True,text=True,timeout=60)
          for line in r.stdout.splitlines():
              if line.startswith('{'): print(line)
          if r.returncode:raise SystemExit('stella_live_action_verification_failed')
          PY
