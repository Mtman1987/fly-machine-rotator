name: Emergency Spotlight Recover
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/emergency-spotlight-recover.yml

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: hmo-dj-worker
      MACHINE: 18545edc699718
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - name: Stop Spotlight machine only
        run: |
          flyctl machine stop "$MACHINE" -a "$APP" || true
          for i in $(seq 1 30); do
            state=$(flyctl machine status "$MACHINE" -a "$APP" --json | jq -r '.state // empty')
            echo "state=$state"
            [ "$state" = "stopped" ] && exit 0
            sleep 4
          done
          echo "Spotlight did not stop"
          exit 1
      - name: Start Spotlight machine only
        run: |
          flyctl machine start "$MACHINE" -a "$APP"
          for i in $(seq 1 30); do
            state=$(flyctl machine status "$MACHINE" -a "$APP" --json | jq -r '.state // empty')
            echo "state=$state"
            [ "$state" = "started" ] && exit 0
            sleep 4
          done
          echo "Spotlight did not start"
          exit 1
      - name: Verify Spotlight health
        run: |
          for i in $(seq 1 24); do
            if curl --fail --show-error --silent --max-time 10 https://hmo-dj-worker.fly.dev:4445/health; then
              echo
              echo "Spotlight health passed"
              exit 0
            fi
            sleep 5
          done
          echo "Spotlight health never passed"
          exit 1
