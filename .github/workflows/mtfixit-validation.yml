name: MtFixIt Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Production build
        run: npm run build

  offline-sandbox:
    name: Offline mock-chat and Discord embed sandbox
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run mock-room report and embed contract tests
        run: npx vitest run test/unifiedReport.test.ts
      - name: Rebuild production bundle after sandbox checks
        run: npm run build
      - name: Render mock Discord embed and chat-room preview
        run: npx tsx scripts/mtfixit-sandbox.ts
      - name: Install Chromium for offline visual snapshot
        run: npx --yes playwright install chromium
      - name: Capture sandbox screenshot
        run: npx --yes playwright screenshot --browser chromium --full-page --viewport-size="1440,1000" "file://$GITHUB_WORKSPACE/artifacts/mtfixit-sandbox.html" artifacts/mtfixit-sandbox.png
      - name: Upload sandbox visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: mtfixit-offline-sandbox
          path: artifacts/
          if-no-files-found: error
