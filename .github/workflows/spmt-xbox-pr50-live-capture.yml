name: SPMT Xbox PR50 live capture

on:
  push:
    branches:
      - ops/spmt-xbox-pr50-live-capture-20260812

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ops/spmt-xbox-pr50-live-capture-20260812
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - name: Capture current Xbox worker state
        shell: bash
        run: |
          set -euo pipefail
          date -u +%Y-%m-%dT%H:%M:%SZ
          flyctl machine list -a spmt-live --json --access-token "$FLY_API_TOKEN" > /tmp/machines.json
          flyctl logs -a spmt-live --json --no-tail --access-token "$FLY_API_TOKEN" > /tmp/logs.jsonl || true
          echo '--- active xbox machines ---'
          jq '[.[] | select((.config.env.FLY_PROCESS_GROUP // .config.metadata.fly_process_group // "") == "xbox" and .state == "started") | {id,name,state,host_status,updated_at,image_ref,events}]' /tmp/machines.json
          echo '--- recent XboxWorker lines ---'
          grep -F 'XboxWorker' /tmp/logs.jsonl | tail -n 20 || true
          echo '--- crash signatures ---'
          grep -Ei 'Runtime\.evaluate timed out|unhandledrejection|unhandled rejection|uncaught|exit(ed)? .*code 1|code 1|CDP connection error' /tmp/logs.jsonl || true
      - name: Remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/spmt-xbox-pr50-live-capture.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/spmt-xbox-pr50-live-capture.yml
          git commit -m 'Remove temporary SPMT Xbox PR50 live capture'
          git push origin HEAD:ops/spmt-xbox-pr50-live-capture-20260812
