name: One-time encrypted Rotator database recovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-rotator-db-once.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-data:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Export Rotator database and JSON records
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_MAIN || secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FLY_API_TOKEN:-}" ]; then echo "No Fly API token configured"; exit 1; fi
          printf '%s\n' '-----BEGIN PUBLIC KEY-----' '' '-----END PUBLIC KEY-----' > /tmp/export-public.pem
          timeout 600s flyctl ssh console --app mtman-machine-rotator --machine 2862e02c9263d8 -C "sh -c 'cd /data && find . -maxdepth 4 -type f \\( -name "mountainview.db*" -o -name "*.json" \\) -print0 | tar --null -T - -cf - | gzip -1 | base64'" > /tmp/data.b64
          base64 -d /tmp/data.b64 > /tmp/rotator-data.tar.gz
          tar -tzf /tmp/rotator-data.tar.gz > /tmp/rotator-file-list.txt
          echo "Archive entries: $(wc -l < /tmp/rotator-file-list.txt); bytes: $(wc -c < /tmp/rotator-data.tar.gz)"
          openssl rand -hex 32 > /tmp/recovery-password
          openssl enc -aes-256-cbc -salt -pbkdf2 -in /tmp/rotator-data.tar.gz -out /tmp/rotator-data.tar.gz.enc -pass file:/tmp/recovery-password
          openssl pkeyutl -encrypt -pubin -inkey /tmp/export-public.pem -in /tmp/recovery-password -out /tmp/rotator-data.key.enc
          rm -f /tmp/data.b64 /tmp/rotator-data.tar.gz /tmp/recovery-password
      - name: Upload encrypted Rotator archive
        uses: actions/upload-artifact@v4
        with:
          name: recovery-rotator-database-encrypted
          path: |
            /tmp/rotator-data.tar.gz.enc
            /tmp/rotator-data.key.enc
            /tmp/rotator-file-list.txt
          retention-days: 1
          if-no-files-found: error
