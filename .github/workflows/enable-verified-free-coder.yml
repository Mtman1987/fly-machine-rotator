name: Enable verified free repair coder
on:
  push:
    branches: [diagnose/chat-tag-fleet-20261006]
    paths:
      - scripts/enable-verified-free-coder.mjs
      - .github/workflows/enable-verified-free-coder.yml
permissions:
  contents: read
concurrency:
  group: verified-free-coder-policy
  cancel-in-progress: false
jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: node --check scripts/enable-verified-free-coder.mjs
      - name: Verify zero active jobs, enable persistent policy, test real coder response
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: node scripts/enable-verified-free-coder.mjs
