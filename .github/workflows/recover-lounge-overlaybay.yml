name: Recover Lounge and OverlayBay state
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-lounge-overlaybay.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recover-lounge-overlaybay
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Recover Lounge and attempt OverlayBay state without media
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_MAIN || secrets.FLY_API_TOKEN }}
        run: |
          set -uo pipefail
          mkdir -p recovered/lounge recovered/overlaybay logs
          if [ -z "${FLY_API_TOKEN:-}" ]; then echo "::error::Fly API token secret missing"; exit 1; fi

          # Lounge: confirmed mounted volume and running machine from inventory.
          APP=hmo-dj-worker
          MACHINE=683ddde2bd1e38
          echo "Lounge target: $APP / $MACHINE" | tee recovered/lounge/TARGET.txt
          cat > /tmp/lounge-recovery.sh <<'REMOTE_SCRIPT'
          set -u
          mkdir -p /tmp/lounge-recovery
          : > /tmp/lounge-recovery/files.txt
          for f in /data/lounge-program.json /data/*.json /data/*.db /data/*.sqlite /data/*.sqlite3; do
            [ -f "$f" ] && printf "%s\\n" "$f" >> /tmp/lounge-recovery/files.txt
          done
          for root in /data/config /data/state /data/lounge /data/runtime /data/backups; do
            if [ -d "$root" ]; then
              find "$root" -xdev -type d \( -iname "*cache*" -o -iname "*media*" -o -iname "*movie*" -o -iname "*music*" -o -iname "*chromium*" \) -prune -o -type f -size -100M \( -iname "*.json" -o -iname "*.jsonl" -o -iname "*.db" -o -iname "*.sqlite" -o -iname "*.sqlite3" -o -iname "*.yaml" -o -iname "*.yml" -o -iname "*.toml" \) -print >> /tmp/lounge-recovery/files.txt 2>/dev/null || true
            fi
          done
          sort -u /tmp/lounge-recovery/files.txt -o /tmp/lounge-recovery/files.txt
          if [ ! -s /tmp/lounge-recovery/files.txt ]; then echo "NO_FILES" > /tmp/lounge-recovery/status; exit 22; fi
          tar -czf /tmp/lounge-recovery.tar.gz -T /tmp/lounge-recovery/files.txt
          tar -tzf /tmp/lounge-recovery.tar.gz > /tmp/lounge-recovery/list.txt
          echo "files=$(wc -l < /tmp/lounge-recovery/list.txt)" > /tmp/lounge-recovery/status
          REMOTE_SCRIPT
          encoded="$(base64 -w0 /tmp/lounge-recovery.sh)"
          if timeout 40s flyctl ssh console --app "$APP" --machine "$MACHINE" --command "sh -c 'echo $encoded | base64 -d > /tmp/lounge-recovery.sh; sh /tmp/lounge-recovery.sh'" --quiet </dev/null > logs/lounge-command.out 2> logs/lounge-command.err; then
            if timeout 180s flyctl ssh sftp get /tmp/lounge-recovery.tar.gz recovered/lounge/lounge-state.tar.gz --app "$APP" --machine "$MACHINE" --quiet </dev/null > logs/lounge-sftp.out 2> logs/lounge-sftp.err; then
              tar -tzf recovered/lounge/lounge-state.tar.gz > recovered/lounge/file-list.txt
              sha256sum recovered/lounge/lounge-state.tar.gz > recovered/lounge/SHA256SUMS
              echo "Lounge extraction archive downloaded and integrity-listed." | tee recovered/lounge/RESULT.txt
            else
              echo "Lounge archive was created remotely but download failed." | tee recovered/lounge/RESULT.txt
            fi
          else
            echo "Lounge extraction command failed; diagnostics retained." | tee recovered/lounge/RESULT.txt
            cat logs/lounge-command.err || true
          fi

          # OverlayBay candidate: start the previously suspended machine only for bounded state extraction,
          # archive small structured state/config files, then suspend it again.
          APP=hmo-dj-worker
          MACHINE=8eddd0ea753148
          echo "OverlayBay candidate: $APP / $MACHINE (activity_data candidate)" | tee recovered/overlaybay/TARGET.txt
          if timeout 60s flyctl machine start "$MACHINE" -a "$APP" > logs/overlaybay-start.out 2> logs/overlaybay-start.err; then
            sleep 8
            cat > /tmp/overlaybay-recovery.sh <<'REMOTE_OVERLAY'
          set -u
          mkdir -p /tmp/overlaybay-recovery
          : > /tmp/overlaybay-recovery/files.txt
          for root in /data /app/data /app/config /app/state; do
            [ -d "$root" ] || continue
            find "$root" -xdev -type d \( -iname "*cache*" -o -iname "*media*" -o -iname "*movie*" -o -iname "*music*" -o -iname "*chromium*" -o -iname "*node_modules*" \) -prune -o -type f -size -100M \( -iname "*.json" -o -iname "*.jsonl" -o -iname "*.db" -o -iname "*.sqlite" -o -iname "*.sqlite3" -o -iname "*.yaml" -o -iname "*.yml" -o -iname "*.toml" \) -print 2>/dev/null >> /tmp/overlaybay-recovery/files.txt || true
          done
          sort -u /tmp/overlaybay-recovery/files.txt -o /tmp/overlaybay-recovery/files.txt
          if [ ! -s /tmp/overlaybay-recovery/files.txt ]; then echo "NO_FILES" > /tmp/overlaybay-recovery/status; exit 22; fi
          tar -czf /tmp/overlaybay-state.tar.gz -T /tmp/overlaybay-recovery/files.txt
          tar -tzf /tmp/overlaybay-state.tar.gz > /tmp/overlaybay-recovery/list.txt
          echo "files=$(wc -l < /tmp/overlaybay-recovery/list.txt)" > /tmp/overlaybay-recovery/status
          REMOTE_OVERLAY
            encoded_overlay="$(base64 -w0 /tmp/overlaybay-recovery.sh)"
            if timeout 60s flyctl ssh console --app "$APP" --machine "$MACHINE" --command "sh -c 'echo $encoded_overlay | base64 -d > /tmp/overlaybay-recovery.sh; sh /tmp/overlaybay-recovery.sh'" --quiet </dev/null > logs/overlaybay-command.out 2> logs/overlaybay-command.err; then
              if timeout 180s flyctl ssh sftp get /tmp/overlaybay-state.tar.gz recovered/overlaybay/overlaybay-state.tar.gz --app "$APP" --machine "$MACHINE" --quiet </dev/null > logs/overlaybay-sftp.out 2> logs/overlaybay-sftp.err; then
                tar -tzf recovered/overlaybay/overlaybay-state.tar.gz > recovered/overlaybay/file-list.txt
                sha256sum recovered/overlaybay/overlaybay-state.tar.gz > recovered/overlaybay/SHA256SUMS
                echo "OverlayBay state archive downloaded and integrity-listed." | tee recovered/overlaybay/RESULT.txt
              else
                echo "OverlayBay archive created remotely, but download failed." | tee recovered/overlaybay/RESULT.txt
              fi
            else
              echo "OverlayBay extraction failed; diagnostics retained." | tee recovered/overlaybay/RESULT.txt
              cat logs/overlaybay-command.err || true
            fi
            timeout 45s flyctl machine suspend "$MACHINE" -a "$APP" > logs/overlaybay-suspend.out 2> logs/overlaybay-suspend.err || true
          else
            echo "Could not start OverlayBay candidate machine; preserved clone remains available for separate recovery mounting." | tee recovered/overlaybay/RESULT.txt
            cat logs/overlaybay-start.err || true
          fi

          find recovered -type f -printf '%s %p\\n' | sort -nr > recovered/FILE-SIZES.txt

      - name: Upload recovery results even if one target fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lounge-overlaybay-recovery-${{ github.run_id }}
          path: |
            recovered/**
            logs/**
          retention-days: 90
          if-no-files-found: warn
