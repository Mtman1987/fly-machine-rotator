name: Deploy SPMT LLM Worker

on:
  push:
    branches:
      - main
    paths:
      - "llm-worker/**"
      - ".github/workflows/deploy-llm-worker.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spmt-fly-production-mutation
  cancel-in-progress: false

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  LLM_APP: spmt-llm-worker
  ROTATOR_APP: mtman-machine-rotator
  FLY_ORG: mtman-new
  FLY_REGION: ord
  MODEL_VOLUME: spmt_llm_models
  LLM_PORT: "8080"

jobs:
  branch-housekeeping:
    name: Retain newest merged branch backup
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Delete older branches already contained in main
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const defaultBranch = context.payload.repository?.default_branch || 'main';
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner, repo, per_page: 100,
            });
            const merged = [];
            for (const branch of branches) {
              if (!branch?.name || branch.name === defaultBranch) continue;
              const comparison = await github.rest.repos.compareCommits({
                owner, repo, base: branch.name, head: defaultBranch,
              });
              if (!['ahead', 'identical'].includes(comparison.data.status)) {
                core.notice(`Retaining unmerged branch ${branch.name}.`);
                continue;
              }
              const commit = await github.rest.repos.getCommit({ owner, repo, ref: branch.commit.sha });
              const date = commit.data.commit.committer?.date || commit.data.commit.author?.date || '1970-01-01T00:00:00Z';
              merged.push({ name: branch.name, sha: branch.commit.sha, date });
            }
            merged.sort((a, b) => Date.parse(b.date) - Date.parse(a.date));
            const newest = merged[0];
            if (newest) core.notice(`Keeping newest merged branch backup ${newest.name} (${newest.sha}).`);
            for (const branch of merged.slice(1)) {
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch.name}` });
                core.notice(`Deleted older merged branch ${branch.name}.`);
              } catch (error) {
                if (error.status === 404 || error.status === 422) {
                  core.warning(`Could not delete ${branch.name}; it may be protected or already absent.`);
                  continue;
                }
                throw error;
              }
            }
  deploy:
    needs: branch-housekeeping
    name: Provision and deploy private spmt-llm-worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Check Fly token
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "FLY_API_TOKEN is not set"
            exit 1
          fi

      - name: Ensure Fly app exists
        run: |
          if ! flyctl status --app "$LLM_APP" >/dev/null 2>&1; then
            flyctl apps create "$LLM_APP" --org "$FLY_ORG"
          fi

      - name: Ensure persistent model volume exists
        run: |
          if ! flyctl volumes list --app "$LLM_APP" --json | jq -e --arg name "$MODEL_VOLUME" 'any(.[]; .name == $name)' >/dev/null; then
            flyctl volumes create "$MODEL_VOLUME" \
              --app "$LLM_APP" \
              --region "$FLY_REGION" \
              --size 10 \
              --yes
          fi

      - name: Remove obsolete model-worker keys
        run: |
          # SPMT authenticates the app/user before any model request. Qwen is an
          # internal implementation service and must not require a second key.
          flyctl secrets unset --app "$LLM_APP" LLAMA_API_KEY || true
          flyctl secrets unset --app "$LLM_APP" LLAMA_ARG_API_KEY_FILE || true
          flyctl secrets unset --app "$ROTATOR_APP" SPMT_LLM_API_KEY || true

      - name: Deploy dedicated private llama.cpp worker
        run: |
          flyctl deploy \
            --app "$LLM_APP" \
            --config llm-worker/fly.toml \
            --dockerfile llm-worker/Dockerfile \
            --remote-only \
            --yes

      - name: Release obsolete public worker addresses
        run: |
          flyctl ips list --app "$LLM_APP" --json > /tmp/llm-worker-ips.json || echo '[]' > /tmp/llm-worker-ips.json
          jq -r '.[] | ((.type // .Type // .kind // .Kind // "") | tostring | ascii_downcase) as $kind | select(($kind | contains("private")) | not) | (.address // .Address // .ip // .IP // empty)' /tmp/llm-worker-ips.json \
            | while IFS= read -r ip; do
                [ -n "$ip" ] || continue
                echo "Releasing obsolete public worker address: $ip"
                flyctl ips release "$ip" --app "$LLM_APP" || true
              done

      - name: Wait for worker model readiness over Fly private network
        run: |
          # llama.cpp can enter started state before the GGUF is fully loaded;
          # /health correctly returns 503 during that window. Retry instead of
          # treating normal model startup as a failed deployment.
          for attempt in $(seq 1 40); do
            if flyctl ssh console --app "$ROTATOR_APP" --command \
              "node -e \"fetch('http://$LLM_APP.internal:$LLM_PORT/health',{signal:AbortSignal.timeout(10000)}).then(async r=>{const t=await r.text();if(!r.ok)throw new Error('health '+r.status+' '+t);console.log(t)}).catch(e=>{console.error(e);process.exit(1)})\""; then
              echo "Qwen worker is ready"
              exit 0
            fi
            echo "Qwen is still loading ($attempt/40); retrying in 15 seconds"
            sleep 15
          done
          echo "Qwen did not become ready within the startup window"
          exit 1

      - name: Verify Qwen chat over the exact keyless private path
        run: |
          # Exercise the exact endpoint used by Athena Coder and Discord DMs.
          # Retry briefly because the first inference after model load can still
          # be slower than later requests on the CPU worker.
          for attempt in $(seq 1 8); do
            if flyctl ssh console --app "$ROTATOR_APP" --command \
              "node -e \"fetch('http://$LLM_APP.internal:$LLM_PORT/v1/chat/completions',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({model:'spmt-qwen3-8b',messages:[{role:'user',content:'Reply with exactly OK.\\n\\n/no_think'}],thinking_budget_tokens:0,max_tokens:32,temperature:0,stream:false}),signal:AbortSignal.timeout(120000)}).then(async r=>{const t=await r.text();if(!r.ok)throw new Error('chat '+r.status+' '+t);const j=JSON.parse(t);const c=String(j?.choices?.[0]?.message?.content||'').trim();if(!c)throw new Error('chat returned no visible content: '+t);console.log('Qwen chat verified:',c.slice(0,80))}).catch(e=>{console.error(e);process.exit(1)})\""; then
              exit 0
            fi
            echo "Qwen chat smoke attempt $attempt/8 failed; retrying in 15 seconds"
            sleep 15
          done
          exit 1

      - name: Show sanitized worker status
        run: flyctl status --app "$LLM_APP"
