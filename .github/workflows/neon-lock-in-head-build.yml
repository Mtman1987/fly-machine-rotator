name: Build Neon Lock-In Gamer head from Discord references

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: neon-lock-in-head-build
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event.issue.number == 72 &&
      github.event.comment.user.login == 'Mtman1987' &&
      github.event.comment.body == '/headbuild'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch reference photos from the specified Discord message
        id: fetch
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN || secrets.DISCORD_TOKEN }}
          DISCORD_CHANNEL_ID: "1476540488147533895"
          DISCORD_MESSAGE_ID: "1563674871119216749"
        shell: bash
        run: |
          set -euo pipefail
          trap 'rc=$?; printf "Discord reference-fetch step failed at: %s (exit %s)\\n" "$BASH_COMMAND" "$rc" > failure-reason.txt' ERR
          if [[ -z "${DISCORD_BOT_TOKEN:-}" ]]; then
            echo "Missing DISCORD_BOT_TOKEN (or DISCORD_TOKEN) repository secret." > failure-reason.txt
            echo "::error::Missing DISCORD_BOT_TOKEN (or DISCORD_TOKEN) repository secret. No KeenFace generation request was made."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bot ${DISCORD_BOT_TOKEN}" \
            "https://discord.com/api/v10/channels/${DISCORD_CHANNEL_ID}/messages/${DISCORD_MESSAGE_ID}" \
            -o discord-message.json
          mkdir -p refs
          mapfile -t attachments < <(jq -r '.attachments[]? | select((.content_type // "" | startswith("image/")) or (.filename | test("\\.(zip|png|jpe?g|webp)$"; "i"))) | [.url, .filename] | @tsv' discord-message.json)
          if [[ ${#attachments[@]} -eq 0 ]]; then
            echo "::error::The Discord message has no image or ZIP attachments. No KeenFace generation request was made."
            exit 1
          fi
          for row in "${attachments[@]}"; do
            url="${row%%$'\t'*}"
            name="${row#*$'\t'}"
            curl --fail-with-body --silent --show-error --location "$url" -o "refs/$(basename "$name")"
          done
          shopt -s nullglob
          for archive in refs/*.zip; do
            unzip -oq "$archive" -d refs/unpacked
          done
          find refs -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \) ! -path '*/unpacked/*' -print0 | while IFS= read -r -d '' f; do cp "$f" refs/; done
          find refs/unpacked -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \) -print0 2>/dev/null | while IFS= read -r -d '' f; do cp "$f" refs/; done
          mapfile -t photos < <(find refs -maxdepth 1 -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \) | sort)
          if [[ ${#photos[@]} -lt 1 || ${#photos[@]} -gt 15 ]]; then
            echo "::error::KeenFace requires 1–15 reference photos; found ${#photos[@]}. No generation request was made."
            exit 1
          fi
          printf '%s\n' "${photos[@]}" > photo-list.txt
          echo "Loaded ${#photos[@]} reference photo(s) from the specified Discord message."

      - name: Create head once, wait for completion, and download ARKit GLB
        id: generate
        env:
          KEENFACE_API_KEY: ${{ secrets.KEENFACE_API_KEY || secrets.KEENTOOLS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'rc=$?; printf "KeenFace generation/download step failed at: %s (exit %s)\\n" "$BASH_COMMAND" "$rc" > failure-reason.txt' ERR
          if [[ -z "${KEENFACE_API_KEY:-}" ]]; then
            echo "Missing KEENFACE_API_KEY (or KEENTOOLS_API_KEY) repository secret; no API request was made." > failure-reason.txt
            echo "::error::Missing KEENFACE_API_KEY (or KEENTOOLS_API_KEY). No API request was made."
            exit 1
          fi
          # Check the account before spending credits.
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${KEENFACE_API_KEY}" \
            "https://api.keenface.ai/v2/account" -o account.json
          jq '{credits: (.credits // .data.credits // .balance // .data.balance)}' account.json
          # Stable key prevents accidental duplicate billing if GitHub retries this same build.
          args=()
          while IFS= read -r photo; do
            args+=(-F "photos=@${photo}")
          done < photo-list.txt
          status=$(curl --silent --show-error \
            --output create-response.json --write-out '%{http_code}' \
            -X POST "https://api.keenface.ai/v2/heads" \
            -H "Authorization: Bearer ${KEENFACE_API_KEY}" \
            -H "Idempotency-Key: neon-lock-in-gamer-1563674871119216749" \
            "${args[@]}")
          if [[ "$status" != "200" && "$status" != "201" && "$status" != "202" ]]; then
            echo "::error::KeenFace head creation returned HTTP $status."
            jq -c '{error, message, detail}' create-response.json 2>/dev/null || head -c 2000 create-response.json
            exit 1
          fi
          head_id=$(jq -er '.id // .data.id // .head.id' create-response.json)
          echo "KeenFace accepted head creation; returned head ID captured."
          printf '%s' "$head_id" > head-id.txt
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${KEENFACE_API_KEY}" \
            "https://api.keenface.ai/v2/heads/${head_id}?wait=600" -o head-status.json
          state=$(jq -er '.status // .data.status // .head.status' head-status.json)
          if [[ "$state" != "completed" ]]; then
            echo "::error::Head did not reach completed status: $state"
            jq '{status: (.status // .data.status // .head.status), error}' head-status.json
            exit 1
          fi
          for attempt in 1 2 3 4 5; do
            status=$(curl --silent --show-error --location \
              --output model-response.json --write-out '%{http_code}' \
              -H "Authorization: Bearer ${KEENFACE_API_KEY}" \
              -H "Accept: application/json" \
              "https://api.keenface.ai/v2/heads/${head_id}/model?mesh_format=glb&blendshapes=arkit")
            [[ "$status" == "200" ]] || { echo "::error::Model endpoint HTTP $status"; cat model-response.json; exit 1; }
            event=$(jq -er '.event' model-response.json)
            if [[ "$event" == "redirect" ]]; then
              download_url=$(jq -er '.data.url' model-response.json)
              break
            fi
            [[ "$event" == "retry-after" ]] || { echo "::error::Unexpected model event: $event"; cat model-response.json; exit 1; }
            wait_seconds=$(jq -er '.data.time_sec' model-response.json)
            sleep "$wait_seconds"
          done
          [[ -n "${download_url:-}" ]] || { echo "::error::GLB download link was not ready after retries."; exit 1; }
          curl --fail-with-body --silent --show-error --location "$download_url" -o Neon_Lock_In_Gamer_Head_ARKit.glb
          [[ "$(head -c 4 Neon_Lock_In_Gamer_Head_ARKit.glb)" == "glTF" ]] || { echo "::error::Downloaded file is not a valid binary GLB."; exit 1; }
          echo "HEAD_ID=$head_id" >> "$GITHUB_ENV"
          echo "Head generation completed and valid ARKit GLB downloaded."

      - name: Upload generated head artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-lock-in-gamer-head-arkit
          path: |
            Neon_Lock_In_Gamer_Head_ARKit.glb
            head-id.txt
          if-no-files-found: error
          retention-days: 7

      - name: Report result to control issue
        if: always()
        uses: actions/github-script@v7
        env:
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          GENERATE_OUTCOME: ${{ steps.generate.outcome }}
        with:
          script: |
            const fs = require('fs');
            const id = fs.existsSync('head-id.txt') ? fs.readFileSync('head-id.txt', 'utf8').trim() : '';
            const ok = fs.existsSync('Neon_Lock_In_Gamer_Head_ARKit.glb');
            const reason = fs.existsSync('failure-reason.txt') ? fs.readFileSync('failure-reason.txt', 'utf8').trim() : 'No failure summary was written; inspect the workflow run logs.';
            const body = ok
              ? '### Neon Lock-In Gamer head build: SUCCESS\\n\\nGenerated the head from the Discord reference photos and uploaded the ARKit GLB artifact.\\n\\nHead ID: `' + id + '`\\nArtifact: `neon-lock-in-gamer-head-arkit`'
              : '### Neon Lock-In Gamer head build: FAILED\\n\\nFetch step: ' + process.env.FETCH_OUTCOME + '\\nGeneration step: ' + process.env.GENERATE_OUTCOME + '\\n\\nReason: ' + reason;
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: 72, body});
