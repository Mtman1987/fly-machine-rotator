name: Apply DSH SPMT service auth patch

on:
  push:
    branches:
      - fix/dsh-spmt-service-auth-20260812
    paths:
      - scripts/patch-dsh-spmt-service-auth.cjs
      - .github/workflows/apply-dsh-spmt-service-auth.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/dsh-spmt-service-auth-20260812
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/patch-dsh-spmt-service-auth.cjs
      - name: Validate
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Commit validated patch
        run: |
          rm scripts/patch-dsh-spmt-service-auth.cjs .github/workflows/apply-dsh-spmt-service-auth.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/spmtAuth.ts src/dshMtFixitGateway.ts test/dshMtFixitGateway.test.ts scripts/patch-dsh-spmt-service-auth.cjs .github/workflows/apply-dsh-spmt-service-auth.yml
          git commit -m "Authorize DSH mtfixit with SPMT service OAuth"
          git push origin HEAD:fix/dsh-spmt-service-auth-20260812
