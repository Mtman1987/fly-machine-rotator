name: Preserve recovery volumes from Fly snapshots

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/preserve-fly-snapshot-volumes.yml"
  workflow_dispatch:
    inputs:
      snapshot_jobs:
        description: "One per line: app|snapshot_id|size_gb|new_volume_name. Keep priority order; originals are never changed."
        required: true
        default: "chat-tag-new|vs_BZZ50vG48YVte4jZoLP|1|chat-tag-recovery-20261024"
        type: string

permissions:
  contents: read

concurrency:
  group: preserve-fly-snapshot-volumes
  cancel-in-progress: false

jobs:
  fork-snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create independent volumes from the supplied snapshots
        id: preserve
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_MAIN || secrets.FLY_API_TOKEN }}
          SNAPSHOT_JOBS: ${{ inputs.snapshot_jobs }}
        run: |
          set -uo pipefail
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "::error::Missing FLY_API_TOKEN_MAIN / FLY_API_TOKEN secret."
            exit 1
          fi
          if [ -z "${SNAPSHOT_JOBS:-}" ]; then
            SNAPSHOT_JOBS="chat-tag-new|vs_BZZ50vG48YVte4jZoLP|1|chat-tag-recovery-20261024"
          fi
          mkdir -p results
          printf 'app\tsnapshot_id\tsize_gb\tvolume_name\tresult\tdetail\n' > results/volume-preservation.tsv
          failures=0
          while IFS='|' read -r app snapshot size name; do
            app="$(printf '%s' "${app:-}" | tr -d '[:space:]')"
            snapshot="$(printf '%s' "${snapshot:-}" | tr -d '[:space:]')"
            size="$(printf '%s' "${size:-}" | tr -d '[:space:]')"
            name="$(printf '%s' "${name:-}" | tr -cd 'A-Za-z0-9_-')"
            [ -n "$app" ] || continue
            case "$app" in *[!A-Za-z0-9_-]*)
              echo "::error::Invalid app name: $app"
              printf '%s\t%s\t%s\t%s\tFAILED\tinvalid_app_name\n' "$app" "$snapshot" "$size" "$name" >> results/volume-preservation.tsv
              failures=$((failures+1)); continue ;;
            esac
            case "$snapshot" in vs_*) ;; *)
              echo "::error::Invalid snapshot ID for $app"
              printf '%s\t%s\t%s\t%s\tFAILED\tinvalid_snapshot_id\n' "$app" "$snapshot" "$size" "$name" >> results/volume-preservation.tsv
              failures=$((failures+1)); continue ;;
            esac
            case "$size" in ''|*[!0-9]*|0)
              echo "::error::Size must be a positive integer GB for $app"
              printf '%s\t%s\t%s\t%s\tFAILED\tinvalid_size\n' "$app" "$snapshot" "$size" "$name" >> results/volume-preservation.tsv
              failures=$((failures+1)); continue ;;
            esac
            if [ -z "$name" ]; then
              echo "::error::New volume name missing for $app"
              printf '%s\t%s\t%s\t%s\tFAILED\tmissing_volume_name\n' "$app" "$snapshot" "$size" "$name" >> results/volume-preservation.tsv
              failures=$((failures+1)); continue
            fi
            echo "::group::Preserving $app snapshot $snapshot as $name"
            # Create a new volume from this snapshot only. Never attach, delete, deploy,
            # or modify the source volume. The region matches the supplied Chat Tag volume.
            set +e
            output="$(timeout 180s flyctl volumes create "$name" --snapshot-id "$snapshot" --size "$size" --region ord -a "$app" --yes 2>&1)"
            rc=$?
            set -e
            printf '%s\n' "$output"
            if [ "$rc" -eq 0 ]; then
              printf '%s\t%s\t%s\t%s\tCREATED\t%s\n' "$app" "$snapshot" "$size" "$name" "$(printf '%s' "$output" | tr '\t\n' '  ' | cut -c1-500)" >> results/volume-preservation.tsv
            else
              printf '%s\t%s\t%s\t%s\tFAILED\texit_%s: %s\n' "$app" "$snapshot" "$size" "$name" "$rc" "$(printf '%s' "$output" | tr '\t\n' '  ' | cut -c1-500)" >> results/volume-preservation.tsv
              failures=$((failures+1))
            fi
            echo "::endgroup::"
          done <<< "$SNAPSHOT_JOBS"
          cat results/volume-preservation.tsv
          echo "failures=$failures" >> "$GITHUB_OUTPUT"
          [ "$failures" -eq 0 ]

      - name: Save preservation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fly-snapshot-volume-preservation-${{ github.run_id }}
          path: results/volume-preservation.tsv
          retention-days: 90
          if-no-files-found: error
