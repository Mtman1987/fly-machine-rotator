app = "spmt-llm-worker"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  LLAMA_ARG_HOST = "::"
  LLAMA_ARG_PORT = "8080"
  LLAMA_ARG_HF_REPO = "Qwen/Qwen3-4B-GGUF:Q4_K_M"
  LLAMA_ARG_ALIAS = "spmt-qwen3-4b"
  LLAMA_ARG_CTX_SIZE = "8192"
  LLAMA_ARG_THREADS = "8"
  LLAMA_ARG_THREADS_HTTP = "4"
  LLAMA_ARG_N_PARALLEL = "2"
  LLAMA_ARG_JINJA = "1"
  LLAMA_ARG_NO_WEBUI = "1"
  LLAMA_ARG_METRICS = "1"
  LLAMA_ARG_TIMEOUT = "120"
  LLAMA_CACHE = "/models"

[mounts]
  source = "spmt_llm_models"
  destination = "/models"
  initial_size = "10gb"

# No public http_service on purpose. Rotator, StreamWeaver, and other SPMT apps
# reach llama.cpp only over Fly's private 6PN hostname:
# http://spmt-llm-worker.internal:8080/v1

[[vm]]
  cpu_kind = "performance"
  cpus = 8
  memory_mb = 16384
