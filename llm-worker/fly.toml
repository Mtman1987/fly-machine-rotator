app = "spmt-llm-worker"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  LLAMA_ARG_HOST = "::"
  LLAMA_ARG_PORT = "8090"
  LLAMA_ARG_HF_REPO = "Qwen/Qwen3-4B-GGUF:Q4_K_M"
  LLAMA_ARG_ALIAS = "spmt-qwen3-4b"
  LLAMA_ARG_CTX_SIZE = "8192"
  LLAMA_ARG_THREADS = "8"
  LLAMA_ARG_THREADS_HTTP = "4"
  LLAMA_ARG_N_PARALLEL = "2"
  LLAMA_ARG_JINJA = "1"
  LLAMA_ARG_NO_WEBUI = "1"
  LLAMA_ARG_METRICS = "1"
  LLAMA_ARG_TIMEOUT = "120"
  LLAMA_CACHE = "/models"

[mounts]
  source = "spmt_llm_models"
  destination = "/models"
  initial_size = "10gb"

[http_service]
  internal_port = 8090
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10m"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "performance"
  cpus = 8
  memory_mb = 16384
